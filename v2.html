<title>Sub-41 Training v2</title>

<style>
/* Layout: one-screen training app. Home shows today and the week; each workout fills the screen in a colour you can read at a glance: blue = hard effort, sage = rest, neutral = easy running and getting ready. */
:root {
  --ink: #1A1D2E;
  --ink-soft: #4F566B;
  --line: #CBD0DA;
  --surface: #F2F4F1;
  --card: #FFFFFF;
  --accent: #2340F0;
  --on-accent: #FFFFFF;
  --work: #2340F0;
  --on-work: #FFFFFF;
  --on-work-soft: rgba(255, 255, 255, 0.84);
  --work-card: rgba(255, 255, 255, 0.14);
  --rest: #D8E4DE;
  --rest-card: #EDF3EF;
  --on-rest: #1A1D2E;
  --on-rest-soft: #46524D;
  --chip: #DDE3FC;
  --fast: #FFC94A;
  --slow: #FF9B8A;
  --ok: #FFFFFF;
  --chip-ink: #1A1D2E;
  --warn: #9A4A12;
  --good: #1E7A4C;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E8EBF2;
    --ink-soft: #A2A9BD;
    --line: #2F3447;
    --surface: #141724;
    --card: #1D2132;
    --accent: #3D58F6;
    --work: #2038D8;
    --rest: #17251F;
    --rest-card: #1F3129;
    --on-rest: #E3EDE8;
    --on-rest-soft: #9FB3AA;
    --chip: #283163;
    --warn: #F2A46B;
    --good: #6FD39C;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  --bg: var(--surface);
  --fg: var(--ink);
  --fg-soft: var(--ink-soft);
  --panel: var(--card);
  height: 100%;
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.3s ease, color 0.3s ease;
}
body[data-phase="work"] { --bg: var(--work); --fg: var(--on-work); --fg-soft: var(--on-work-soft); --panel: var(--work-card); }
body[data-phase="rest"],
body[data-phase="done"] { --bg: var(--rest); --fg: var(--on-rest); --fg-soft: var(--on-rest-soft); --panel: var(--rest-card); }

#app {
  height: 100%;
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
p { margin: 0; }
h1, h2, h3 { margin: 0; }
.soft { color: var(--fg-soft); }

/* Controls */
button, select, input { font: inherit; color: inherit; }
.btn {
  appearance: none;
  font-weight: 700;
  font-size: 1.05rem;
  min-height: 3.25rem;
  padding: 0 1rem;
  border-radius: 0.875rem;
  border: 2px solid var(--fg);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
body[data-phase="work"] .btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.wide { width: 100%; min-height: 4rem; font-size: 1.25rem; }
.btn.small { min-height: 2.75rem; font-size: 0.95rem; padding: 0 0.9rem; white-space: nowrap; }
.btn:disabled { opacity: 0.4; }
.btn:active { transform: translateY(1px); }
.link-btn {
  appearance: none;
  background: none;
  border: 0;
  padding: 0.5rem 0.25rem;
  min-height: 2.75rem;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 0.2em;
  cursor: pointer;
  touch-action: manipulation;
}
.btn:focus-visible, .link-btn:focus-visible, .seg button:focus-visible, select:focus-visible, .row:focus-visible, .step-btn:focus-visible, input:focus-visible, .unlock:focus-visible, .choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
body[data-phase="work"] .btn:focus-visible, body[data-phase="work"] .step-btn:focus-visible { outline-color: var(--fg); }

.label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-soft); }
.seg { display: flex; border: 2px solid var(--fg); border-radius: 0.75rem; overflow: hidden; }
.seg button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  min-height: 2.75rem;
  padding: 0 0.3rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  font-variant-numeric: tabular-nums;
}
.seg button + button { border-left: 2px solid var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.select-wrap { position: relative; }
.select-wrap::after {
  content: "";
  position: absolute;
  right: 0.9rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--fg);
  border-bottom: 2px solid var(--fg);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  font-weight: 700;
  min-height: calc(2.75rem + 4px);
  padding: 0 2.25rem 0 0.75rem;
  border: 2px solid var(--fg);
  border-radius: 0.75rem;
  background: transparent;
}
.field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

/* Screens with a list (home, setup, history) */
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 1.4rem; padding-top: 1rem; }
.scroll > *, .done > *, .stage-inner > * { flex-shrink: 0; }
.back { align-self: flex-start; margin: -0.25rem 0 -0.75rem; }
.title {
  margin-top: 0.35rem;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 3.5rem;
  font-size: clamp(3rem, 15vw, 5.5rem);
  line-height: 0.85;
  letter-spacing: -0.01em;
}
.lede { margin-top: 0.6rem; color: var(--fg-soft); max-width: 38ch; }
.panel, .notice { background: var(--panel); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.panel-row > div { min-width: 0; }
.status, .notice-title { font-weight: 700; }
.status-note { font-size: 0.9rem; color: var(--fg-soft); }
.notice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.4rem; background: var(--fg-soft); vertical-align: 0.05em; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.fine { font-size: 0.85rem; color: var(--fg-soft); }
.sticky-bar { position: sticky; bottom: 0; margin-top: auto; padding: 0.75rem 0 1rem; background: var(--bg); }
.chip { display: inline-block; margin-left: 0.3rem; padding: 0.05rem 0.45rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--chip); color: var(--fg); vertical-align: 0.1em; }

/* Home */
.today { display: flex; flex-direction: column; gap: 0.6rem; }
.today-item { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; background: var(--panel); border-radius: 1rem; padding: 0.85rem 0.9rem 0.85rem 1rem; }
.today-item > div { min-width: 0; }
.today-item .what { font-weight: 700; font-size: 1.1rem; line-height: 1.25; }
.today-item .sub { font-size: 0.9rem; color: var(--fg-soft); }
.done-tag { font-weight: 700; color: var(--good); white-space: nowrap; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.choice {
  appearance: none;
  border: 2px solid var(--fg);
  border-radius: 1rem;
  background: transparent;
  padding: 0.9rem 1rem 1rem;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  min-height: 7rem;
}
.choice .big-word { font-family: var(--font-display); font-weight: 900; font-size: 2.6rem; line-height: 0.9; }
.choice .sub { font-size: 0.9rem; color: var(--fg-soft); }
.week-list { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--fg); }
.week-list li { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 0.5rem; align-items: baseline; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.week-list .d { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1; }
.week-list .w { min-width: 0; }
.week-list .w > span { display: block; }
.week-list .w .muted { color: var(--fg-soft); }
.week-list .tick { font-weight: 700; color: var(--good); white-space: nowrap; }
.week-list li.is-today .d { color: var(--accent); }
.week-list li.is-today { background: linear-gradient(90deg, var(--panel), transparent); }
.section-title { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; margin-bottom: 0.4rem; }
/* Rearranging the week (v2): Edit week shows a handle on each session; drag it to a day, or tap the session to pick one */
.week-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.4rem; }
.week-head .section-title { margin-bottom: 0; }
.wk-help { font-size: 0.9rem; color: var(--fg-soft); margin: 0 0 0.5rem; }
.week-list .w > .wk-warn { color: var(--warn); font-size: 0.85rem; font-weight: 600; line-height: 1.3; margin-top: 0.15rem; }
.week-list.editing, .week-list.editing * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.week-list.editing li { grid-template-columns: 3rem minmax(0, 1fr); align-items: start; min-height: 3.5rem; padding: 0.3rem 0; transition: background-color 0.12s ease, box-shadow 0.12s ease; }
.week-list.editing .dt { display: none; }
.week-list.editing .d { padding-top: 0.75rem; }
.week-list .w > .wk-item { display: flex; align-items: center; gap: 0.3rem; }
.week-list .w > .wk-still { display: flex; align-items: center; min-height: 2.75rem; }
.wk-fixed { margin-left: 0.3rem; font-size: 0.85rem; font-weight: 600; color: var(--fg-soft); }
.wk-name { appearance: none; flex: 1; min-width: 0; min-height: 2.75rem; padding: 0.3rem 0; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer; touch-action: manipulation; }
.wk-handle { flex-shrink: 0; width: 2.75rem; height: 2.75rem; display: flex; align-items: center; justify-content: center; border-radius: 0.65rem; background: var(--panel); font-size: 1.45rem; font-weight: 700; line-height: 1; cursor: grab; touch-action: none; }
.wk-handle:active { background: var(--chip); }
.wk-item.wk-src { opacity: 0.35; }
.week-list li.wk-over { background: var(--chip); box-shadow: inset 0 0 0 2px var(--accent); border-radius: 0.5rem; }
.wk-ghost { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; max-width: calc(100vw - 16px); padding: 0.7rem 1rem; border-radius: 0.875rem; background: var(--fg); color: var(--bg); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3); }
body.wk-dragging, body.wk-dragging * { cursor: grabbing; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.wk-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.75rem; }
.wk-toast { position: fixed; z-index: 55; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); width: calc(100% - 32px); max-width: 32rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.5rem 0.5rem 0.5rem 1rem; border-radius: 0.875rem; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 0.95rem; line-height: 1.3; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
.wk-toast button { appearance: none; flex-shrink: 0; min-height: 2.75rem; padding: 0 1rem; border-radius: 0.65rem; border: 2px solid currentColor; background: transparent; color: inherit; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.wk-sheet-wrap { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; }
.wk-scrim { position: absolute; inset: 0; background: rgba(10, 12, 20, 0.45); }
.wk-sheet { position: relative; width: 100%; max-width: 34rem; max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); color: var(--fg); border-radius: 1.25rem 1.25rem 0 0; padding: 1.1rem max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 0.75rem) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 0.7rem; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2); }
.wk-sheet:focus { outline: none; }
.wk-sheet-title { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; }
.wk-sheet .btn { width: 100%; }
.wk-sheet .wk-cancel { align-self: center; }
.wk-days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
.wk-days button { appearance: none; min-height: 3.25rem; border-radius: 0.75rem; border: 2px solid var(--fg); background: transparent; color: inherit; font: inherit; font-weight: 700; line-height: 1.1; cursor: pointer; touch-action: manipulation; }
.wk-days button small { display: block; font-size: 0.7rem; font-weight: 600; }
.wk-days button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.wk-days button:disabled { opacity: 0.4; cursor: default; }
.wk-warn-line { color: var(--warn); font-weight: 700; }
.wk-name:focus-visible, .wk-days button:focus-visible, .wk-toast button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Run setup and strength plan */
.session { display: flex; flex-direction: column; gap: 0.8rem; }
.session-name { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 0.9; text-wrap: balance; }
.session-sub { color: var(--fg-soft); }
.steps { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--fg); }
.steps li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: baseline; padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
.steps .what { font-weight: 600; min-width: 0; }
.steps .what span { display: block; font-weight: 400; font-size: 0.92rem; color: var(--fg-soft); }
.steps .how { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.total { font-weight: 600; color: var(--fg-soft); }
.plan { display: flex; flex-direction: column; gap: 1.1rem; }
.pair { border-top: 3px solid var(--fg); padding-top: 0.35rem; }
.pair-head { display: flex; justify-content: space-between; }
.row {
  appearance: none;
  width: 100%;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  display: grid;
  grid-template-columns: 2.4rem minmax(0, 1fr) auto;
  gap: 0.5rem;
  align-items: baseline;
  padding: 0.55rem 0;
  cursor: pointer;
  touch-action: manipulation;
}
.pair .row:last-of-type { border-bottom: 0; }
.row .tag { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1; }
.row .nm { font-weight: 600; min-width: 0; }
.row .dose { display: block; font-weight: 400; font-size: 0.9rem; color: var(--fg-soft); }
.row .kg { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .kg .soft { font-weight: 500; font-size: 0.9rem; }
.row[aria-expanded="true"] .nm { text-decoration: underline; text-underline-offset: 0.2em; }
.tap-hint { font-size: 0.85rem; color: var(--fg-soft); margin-top: -0.6rem; }
.week-note { font-size: 0.95rem; color: var(--fg-soft); margin-top: -0.75rem; }
.history details { border-top: 1px solid var(--line); }
.history details:last-of-type { border-bottom: 1px solid var(--line); }
.history summary { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; min-height: 2.75rem; cursor: pointer; list-style: none; font-weight: 600; }
.history summary::-webkit-details-marker { display: none; }
.history summary .soft { font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.history ul { list-style: none; margin: 0 0 0.75rem; padding: 0; font-size: 0.92rem; }
.history li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.15rem 0; font-variant-numeric: tabular-nums; }
.history li span:first-child { color: var(--fg-soft); min-width: 0; }
.history li span:last-child { font-weight: 600; white-space: nowrap; }

/* Figure */
.fig { color: var(--fg); display: flex; justify-content: center; }
.fig svg, .fig canvas { display: block; width: 100%; height: 100%; max-width: 100%; }
.fig-start { height: 11rem; margin: 0.25rem 0 0.5rem; }
.fig-set { height: clamp(9.5rem, 27vh, 15rem); }
.fig-next { height: clamp(8rem, 21vh, 12rem); }

/* Live workout */
.run { padding-top: 0.4rem; }
.run-top { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; min-height: 2.75rem; }
.run-top .run-title { font-weight: 700; min-width: 0; }
.run-top .meta { font-size: 0.85rem; font-weight: 600; color: var(--fg-soft); font-variant-numeric: tabular-nums; text-align: right; line-height: 1.3; white-space: nowrap; }
.prog { height: 0.35rem; border-radius: 0.2rem; background: rgba(127, 127, 127, 0.28); overflow: hidden; margin-top: 0.25rem; }
.prog > div { height: 100%; background: var(--fg); transform-origin: left center; }
.segs { display: flex; gap: 2px; align-items: center; height: 0.9rem; margin-top: 0.25rem; }
.segs span { height: 0.45rem; border-radius: 1px; background: var(--fg); opacity: 0.22; min-width: 2px; }
.segs span.w { height: 0.65rem; }
.segs span.done { opacity: 0.65; }
.segs span.now { opacity: 1; height: 0.9rem; }
.banner { margin-top: 0.5rem; background: var(--panel); border-radius: 0.75rem; padding: 0.55rem 0.8rem; font-size: 0.9rem; font-weight: 600; }
.stage { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
.stage-inner { margin-block: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-block: 0.75rem; }
.phase-name { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; font-size: clamp(2.3rem, 11vw, 3.4rem); line-height: 0.92; }
.phase-sub { font-weight: 600; color: var(--fg-soft); }
.count { display: flex; align-items: baseline; gap: 0.5rem; margin: 0.2rem 0 0; font-family: var(--font-display); font-weight: 900; font-size: 7rem; font-size: clamp(5.5rem, 31vw, 9.5rem); line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.count small { font-family: var(--font-ui); font-size: 1.1rem; font-weight: 700; letter-spacing: 0; }
body.is-paused .count, body.is-paused .counter .num, body.is-paused .count-big { opacity: 0.35; }
.bar { height: 0.55rem; border-radius: 0.3rem; background: rgba(127, 127, 127, 0.28); overflow: hidden; }
.bar > div { height: 100%; background: var(--fg); transform-origin: left center; transform: scaleX(0); }
.detail { font-weight: 600; font-variant-numeric: tabular-nums; }
.pace-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.pace-box { background: var(--panel); border-radius: 0.875rem; padding: 0.7rem 0.85rem; display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.pace-val { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pace-val small { font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600; }
.pace-val.window { font-size: 1.75rem; line-height: 1.15; }
.call { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; border-radius: 0.875rem; padding: 0.7rem 0.9rem; background: var(--ok); color: var(--chip-ink); font-weight: 700; }
.call.fast { background: var(--fast); }
.call.slow { background: var(--slow); }
.call .call-word { font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; }

<body data-phase="idle">
<main id="app"></main>
<div id="lock" class="lock" hidden>
  <button type="button" id="unlockBtn" class="unlock"><span class="unlock-fill"></span><span class="unlock-text">Locked. Hold to unlock</span></button>

<script>
// 3D exercise avatars (v2): ray-marched in one WebGL2 shader, no libraries or model files.
// Bodies are sculpted from smooth-blended shapes grouped per body part (torso, legs, head, arms, props);
// each part has a bounding sphere so the shader only evaluates the parts near each ray.
// Poses reuse the app's 2D side-view pose data and are solved in 3D with two-bone IK.
const AV3D = (() => {
  "use strict";

  // ---------- vector helpers ----------
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const sum = (...v) => v.reduce((a, b) => add(a, b));
  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerpAng = (a, b, k) => a + ((((b - a) % 360) + 540) % 360 - 180) * k;
  const rad = (a) => a * Math.PI / 180;
  const rotY = (v, a) => { const c = Math.cos(a), s = Math.sin(a); return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c]; };
  const perp = (v, axis) => norm(sub(v, mul(axis, dot(v, axis))));

  // ---------- materials ----------
  const MAT = { skin: 0, hair: 1, top: 2, bottom: 3, shoe: 4, sole: 5, sock: 6, eye: 7, dbHead: 8, metal: 9, pad: 10, frame: 11 };
  const PALETTE = {
    skin: "#D29C78", hairM: "#2E2119", hairF: "#5C3A26", top: "#F0643F", bottom: "#252A3B",
    shoe: "#F3F2EE", sole: "#3B4050", sock: "#F3F2EE", sclera: "#EEEAE4",
    dbHead: "#2E323B", metal: "#AEB4BD", pad: "#2A2D35", frame: "#8E95A0",
    lipM: "#B4705E", lipF: "#BF6A66", browM: "#271C15", browF: "#43291B", irisM: "#4B3222", irisF: "#5E4329"
  };
  const hex = (h) => [1, 3, 5].map((i) => Math.pow(parseInt(h.substr(i, 2), 16) / 255, 2.2));

  // ---------- body specs (metres) ----------
  const SPEC = {
    m: { s: 0.0113, shW: 0.172, hipW: 0.088, hs: 1.03, ankH: 0.075, out: 1, delt: 0.044, neck: [0.058, 0.052], trap: [0.044, 0.03] },
    f: { s: 0.0105, shW: 0.158, hipW: 0.086, hs: 0.985, ankH: 0.07, out: 0.85, delt: 0.037, neck: [0.048, 0.044], trap: [0.034, 0.024] }
  };

  // ---------- poses: the page's 2D pose data plus 3D extras ----------
  const sh = (x, y, b) => ({ to: "sh", p: [x, y], b: b == null ? 1 : b });
  let ANIM = {
    stand: { tempo: [1, 1], db: [], p: [
      { hip: [120, 81], torso: -90, n: [121, 154, 7], f: [119, 154, 7], an: sh(-1, 53.5), af: sh(-1, 53.5) },
      { hip: [120, 81], torso: -90, n: [121, 154, 7], f: [119, 154, 7], an: sh(-1, 53.5), af: sh(-1, 53.5) }] }
  };
  // grip: "fwd" = neutral (palms in), "lat" = overhand. out = hands away from the body. side = lying on the side facing the camera.
  const X3 = {
    stand: { grip: "fwd", out: 0.06, turn: 9 },
    split: { grip: "fwd", out: 0.03 }, row1: { grip: "fwd", out: 0.02, absZ: 0.07 }, rdl: { grip: "lat", out: 0 },
    bench: { grip: "lat", out: 0.05 }, plank: { side: true, lift: 0.16 }, calf: { grip: "fwd", out: 0.03 },
    step: { grip: "fwd", out: 0.03 }, incline: { grip: "lat", out: 0.05 }, slrdl: { grip: "fwd", out: 0.01 },
    row2: { grip: "fwd", out: 0.0 }, thrust: { dbHips: true }, march: { grip: "fwd", out: 0.03 },
    // added with the 2026 programme. out as [start, end] moves the hands sideways during the rep; sup = palms forward;
    // twoHand = both hands on one dumbbell
    lat: { grip: "fwd", out: [0.07, 0.56] }, curl: { grip: "sup", out: 0.05 }, tri: { grip: "fwd", out: -0.13, twoHand: true },
    deadbug: { grip: "fwd", out: 0.02 }, birddog: { grip: "fwd", out: 0.0 }
  };
  function setAnim(a) { ANIM = Object.assign({}, a, { stand: ANIM.stand }); frames.clear(); }

  // ---------- IK ----------
  function ik3(R, T, l1, l2, pole) {
    const d = sub(T, R), d0 = len(d) || 1e-4;
    const dist = Math.min(l1 + l2 - 1e-3, Math.max(Math.abs(l1 - l2) + 1e-3, d0));
    const u = mul(d, 1 / d0);
    const a = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));

    return { mid: add(add(R, mul(u, a)), mul(p, h)), end: add(R, mul(u, dist)), pole: p };
  }
  function pole2D(R, T, bend) {
    const dx = T[0] - R[0], dyDown = -(T[1] - R[1]), l = Math.hypot(dx, dyDown) || 1;
    return [-(dyDown / l) * bend, -(dx / l) * bend, 0];
  }

  // ---------- skeleton from a pose ----------
  function skeleton(key, k, sex) {
    const A = ANIM[key], X = X3[key] || {}, P0 = A.p[0], P1 = A.p[1], S = SPEC[sex], s = S.s, sc = s / 0.0113;
    const M = (p, z) => [(p[0] - 120) * s, (158 - p[1]) * s, z];
    const hip2 = [lerp(P0.hip[0], P1.hip[0], k), lerp(P0.hip[1], P1.hip[1], k)];
    const ta = rad(lerpAng(P0.torso, P1.torso, k));
    const u = norm([Math.cos(ta), -Math.sin(ta), 0]);
    let l = [0, 0, 1], f = cross(u, l);
    if (X.side) { l = u[0] <= 0 ? [-u[1], u[0], 0] : [u[1], -u[0], 0]; if (l[1] < 0) l = mul(l, -1); f = [0, 0, 1]; }
    const hipC = add(M(hip2, 0), [0, X.lift || 0, 0]), neckB = add(hipC, mul(u, 52 * s));
    const pitch = rad(7);
    const hu = norm(add(mul(u, Math.cos(pitch)), mul(f, Math.sin(pitch)))), hf = norm(sub(mul(f, Math.cos(pitch)), mul(u, Math.sin(pitch))));
    const sk = { key: key, u: u, f: f, r: l, hu: hu, hf: hf, hipC: hipC, neckB: neckB, sex: sex, legs: [], arms: [], props: [], side: !!X.side };
    sk.headC = add(add(neckB, mul(u, 14.6 * s)), mul(f, 0.018));
    const supports = [158].concat((A.bench || []).filter((b) => b[0] === "r").map((b) => b[2]));
    const raise = S.ankH - 4 * s, thL = 38 * s, shL = 36 * s - raise, fs = sex === "m" ? 1 : 0.88;
    ["n", "f"].forEach((side, i) => {
      const sg = i === 0 ? 1 : -1;
      const a = P0[side], b = P1[side];
      const ank2 = [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
      const fa = lerpAng(a[2], b[2], k), fa0 = ((fa % 360) + 540) % 360 - 180;
      const hipJ = add(hipC, mul(l, sg * S.hipW));
      let ank, fd, pole;
      if (X.side) {
        ank = add(M(ank2, 0), [0, 0.012, 0]); if (sg > 0) ank = add(ank, mul(l, 0.04));
        fd = f; pole = f;
      } else {
        ank = M(ank2, sg * S.hipW); fd = norm([Math.cos(rad(fa)), -Math.sin(rad(fa)), 0]);
        // planted feet: flat on the floor or bench (wf), or up on the toes (wt)
        let wf = 0, sy = 158, wt = 0, syT = 158;
        supports.forEach((y) => { const w = 1 - clamp((Math.abs(y - (ank2[1] + 4)) - 1) / 4, 0, 1); if (w > wf) { wf = w; sy = y; } });
        wf *= 1 - clamp((Math.abs(fa0) - 8) / 10, 0, 1);
        if (Math.abs(fa0) < 80) {
          const toeY = ank2[1] + 12 * Math.sin(rad(fa));
          supports.forEach((y) => { const w = 1 - clamp((Math.abs(y - 4 - toeY) - 1) / 4, 0, 1); if (w > wt) { wt = w; syT = y; } });
        }

  // ----- Live run -----

    h += '<div class="call" id="call" hidden><span class="call-word" id="callWord"></span><span class="call-meta" id="callMeta"></span></div>';
    h += '<p class="next">' + (nx ? "Next: " + esc(nx.label.toLowerCase()) + " <span>· " + fmtKm(nx.dist) + ", " + esc(nx.desc) + "</span>" : R.segs.length === 1 ? "Keep it easy all the way" : "Last stretch to the finish") + "</p></div></div>";

  }
  function runControls(intervals) {

    }

    if (intervals) h += '<button type="button" class="btn" data-act="run-skip"' + (R.paused ? " disabled" : "") + ">Skip</button>";
    h += '<button type="button" class="btn" data-act="run-end">End</button></div>';

  function phaseTitle(ph) {

  function paintRun(t) {
    if (!R || R.done || ui.view !== "run") return;

    let bigHtml = "", subText = "", detText = "", frac = 0;
    if (R.mode === "int") {
      if (tc) tc.textContent = fmtClock(tt - R.startedAt);
      const ph = R.phases[R.i], el = tt - R.phaseStart;
      if (ph.type === "work" && ph.kind === "dist") {
        const left = Math.max(0, ph.dist - (R.cur ? R.cur.dist : 0));

        frac = R.cur ? R.cur.dist / ph.dist : 0;

      } else {
        bigHtml = fmtClock(ph.dur * 1000 - el);
        frac = el / (ph.dur * 1000);
        if (ph.type === "work") { subText = fmtWork(R.plan) + " at " + fmtPace(ZONES[R.plan.zone].target) + "/km"; detText = R.cur ? fmtDist(R.cur.dist) + " so far" : ""; }
        else if (ph.type === "warmup") {

          if (k === -1) subText = "Easy. Interval 1 is next.";
          else if (s >= STRIDES[k]) subText = "Stride " + (k + 1) + " of 4: ease off in " + Math.ceil(STRIDES[k] + STRIDE_LEN - s) + " s";
          else subText = (k === 0 ? "Easy running. Strides start in " : "Easy. Stride " + (k + 1) + " in ") + fmtClock((STRIDES[k] - s) * 1000);
        } else if (ph.type === "rest") {
          subText = "Jog easy";
          const last = R.reps[R.reps.length - 1];
          if (last) detText = "Interval " + last.n + ": " + fmtDist(last.dist) + " in " + fmtClock(last.time * 1000) + (last.pace ? ", " + fmtPace(last.pace) + "/km" : "");
        } else subText = "Easy jog to finish";
      }

    } else {
      const el = tt - R.runStart, sg = R.segs[R.segIdx];

      frac = R.totalDist / R.total;
      subText = sg.desc.charAt(0).toUpperCase() + sg.desc.slice(1);
      if (R.strides && R.strideStart != null) {
        const s = (tt - R.strideStart) / 1000, cyc = R.strides.on + R.strides.off, k = Math.floor(s / cyc);
        if (k < R.strides.n) {

          if (k + 1 >= R.strides.n && inS >= R.strides.on) subText = "Strides done. Easy to the finish.";
        }
      } else if (R.strides) subText += " · strides from " + fmtKm(R.strides.from);
      const segLeft = Math.max(0, sg.end - R.totalDist);
      detText = (R.segs.length > 1 ? fmtDist(segLeft) + " left of this block · " : "") + fmtDist(Math.max(0, R.total - R.totalDist)) + " to go";
      if (!gpsHealthy(t)) detText = "No GPS signal: distance paused until it's back";
      const avg = $("avgPace");
      if (avg) avg.innerHTML = R.totalDist >= 200 ? fmtPace((el / 1000) / (R.totalDist / 1000)) + "<small> /km</small>" : "–";
    }
    if (R.paused) subText = "Paused";
    if (big && big.innerHTML !== bigHtml) big.innerHTML = bigHtml;
    if (sub && sub.textContent !== subText) sub.textContent = subText;
    if (det && det.textContent !== detText) det.textContent = detText;
    if (fill) fill.style.transform = "scaleX(" + Math.min(1, Math.max(0, frac)).toFixed(4) + ")";
    const lp = $("livePace"); if (lp) { const v = livePace(); lp.innerHTML = v ? fmtPace(v) + "<small> /km</small>" : "–"; }
    const call = $("call");
    if (call) {
      let word = null, meta = "", cls = "on";
      const newest = Math.max(R.lastQ ? R.lastQ.seq : 0, R.lastKm ? R.lastKm.seq : 0, R.lastCall && R.lastCall.seq ? R.lastCall.seq : 0);
      if (R.mode !== "int" && R.midShow && R.midShow.seq > newest) {
        // the halfway call, until the next call replaces it
        word = "Halfway"; cls = "mid"; meta = midMeta(R.midShow.m);
      } else if (R.mode === "int" || (R.lastCall && R.segs[R.segIdx].half)) {
        if (R.lastCall) { word = PHRASE[R.lastCall.v]; cls = R.lastCall.v; meta = fmtPace(R.lastCall.pace) + "/km at " + R.lastCall.m + " m"; }
      } else if (R.lastQ && (!R.lastKm || R.lastQ.seq > R.lastKm.seq)) {
        // latest 250 m check (newer than the last km call)
        word = R.lastQ.word; cls = R.lastQ.v; meta = fmtPace(R.lastQ.pace) + "/km at " + fmtDist(R.lastQ.m);
      } else if (R.lastKm) {
        const v = R.lastKm.v;
        cls = v || "on";
        word = v === "fast" ? (R.segs[R.segIdx].mode === "fast" ? "Ease off" : "Slow down") : v === "slow" ? "Speed up" : "Km " + R.lastKm.k;
        meta = "Split " + fmtPace(R.lastKm.split) + "/km";

      if (word) { call.className = "call " + cls; $("callWord").textContent = word; $("callMeta").textContent = meta; }
    }
    const gl = $("gpsLine"); if (gl) gl.textContent = gps.state === "good" ? "GPS ±" + Math.round(gps.acc) + " m" : gpsSummary().text;
    const bn = $("banner");
    if (bn) { const msg = (R.note && t < R.noteUntil ? R.note : "") || (wakeAtRisk() ? WAKE_MSG : ""); bn.hidden = !msg; if (bn.textContent !== msg) bn.textContent = msg; }
  }

  // ----- Run summary -----
  // Runs saved by older versions of the page may lack some lists, so every list is read through these
  const repsOf = (r) => (Array.isArray(r.reps) ? r.reps : []);
  const splitsOf = (x) => (Array.isArray(x.splits) ? x.splits : []);
  const kmsOf = (r) => (Array.isArray(r.kms) ? r.kms : []);
  const blocksOf = (r) => (Array.isArray(r.blocks) ? r.blocks : []);
  // First and second half (v2, from the halfway call). Runs saved before it have no r.mid, so no line.
  function halfLine(r) {
    const h = r && r.mid;
    if (!h || !(h.t > 0) || runKind(r) === "intervals") return "";
    let s = "First half " + fmtClock(h.t * 1000);
    if (r.complete && r.dur > h.t) {
      const t2 = r.dur - h.t, d = t2 - h.t;

    }

  }
  function runSummaryText(r) {
    const lines = ["Sub-41 " + (runKind(r) === "intervals" ? "intervals" : runKind(r) + " run") + ": week " + r.w + ", " + r.title + ", " + fmtDay(r.date)];
    if (runKind(r) === "intervals") {
      lines.push("Total " + fmtClock(r.dur * 1000) + ", " + fmtDist(r.dist));
      repsOf(r).forEach((x) => lines.push("Interval " + x.n + ": " + fmtDist(x.dist) + " in " + fmtClock(x.time * 1000) + " (" + fmtPace(x.pace) + "/km)" + (splitsOf(x).length ? ", splits " + splitsOf(x).map(fmtPace).join(", ") : "")));
    } else {
      lines.push(fmtDist(r.dist) + " in " + fmtClock(r.dur * 1000) + ", average " + fmtPace(r.avg) + "/km");
      if (halfLine(r)) lines.push(halfLine(r));

  }
  function renderRunDone() {

  // =====================================================================

  function rtJudge(j, pace, tol) {

  // Time spent paused doesn't count towards pace

  function renderGallery() {
    document.body.setAttribute("data-phase", "idle");
    const km = /[?&]k=([0-9.]+)/.exec(location.search), k = km ? Math.min(1, Math.max(0, +km[1])) : 0, m = /[?&]m=1/.test(location.search) ? "1" : "0";
    app.innerHTML = '<div class="gallery">' + Object.keys(ANIM).map((a) => "<div>" + a + '<div class="fig" data-fig="' + a + '" data-mode="still" data-k="' + k + '" data-m="' + m + '"></div></div>').join("") + "</div>";
  }

  // =====================================================================
  // Events
  // =====================================================================
  function nudge(d) {
    if (!C || !SETS[C.k]) return;
    const id = SETS[C.k].ex;
    let v = C.weights[id]; if (v == null) v = 0;
    v = Math.max(0, Math.round((v + d) * 2) / 2);
    C.weights[id] = v; saveStrength();
    const inp = $("kgInput"); if (inp) inp.value = fmtKg(v);
    const sk = $("setKg"); if (sk) sk.textContent = weightText(id);
    const er = $("kgErr"); if (er) er.textContent = "";
  }
  function copyText(text, b) {
    const fallback = () => { ui.copyText = text; render(); const box = $("copyBox"); if (box) { box.focus(); box.select(); } };
    try { navigator.clipboard.writeText(text).then(() => { b.textContent = "Copied"; }, fallback); } catch (err) { fallback(); }
  }
  app.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    unlockAudio();
    const act = b.getAttribute("data-act");
    switch (act) {
      case "home": if (!R) stopGps(); ui.view = "home"; ui.lastRun = null; ui.lastLift = null; ui.copyText = null; ui.lastRoute = null; ui.hl = null; ui.gpx = null; ui.gpxMsg = ""; ui.doneFrom = null; mapReset(); render(); app.scrollTop = 0; break;
      case "open-run": openRun(b.getAttribute("data-id"), "runs"); break;
      case "back-runs": backToRuns(); break;
      case "gpx-copy": copyGpx(b); break;
      case "go-run": {
        ui.view = "runSetup"; ui.rKind = b.getAttribute("data-k") || null; ui.rVar = b.getAttribute("data-v") || null;
        ui.rWeek = b.getAttribute("data-w") ? +b.getAttribute("data-w") : null; ui.lastLift = null; ui.copyText = null;
        startGps(); render(); break;
      }
      case "go-lift": ui.view = "liftSetup"; ui.sType = b.getAttribute("data-s") || null; ui.preview = null; render(); break;
      // rearranging the week
      case "wk-edit": {
        ui.wkEdit = true; render();
        const sec = $("weekSec"); if (sec && sec.scrollIntoView) sec.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
        break;
      }
      case "wk-done": ui.wkEdit = false; render(); break;
      case "wk-pick": if (Date.now() - wkDragEndAt > 450) wkOpen(b.getAttribute("data-id"), null); break;
      case "wk-undo": wkUndoLast(); break;
      case "wk-reset": wkS = { mode: "reset", at: Date.now() }; wkSheetPaint(); break;
      // run setup
      case "rkind": ui.rKind = b.getAttribute("data-k"); render(); break;
      case "rvar": ui.rVar = b.getAttribute("data-v"); render(); break;
      case "tol": RS.tol = +b.getAttribute("data-tol"); saveRuns(); render(); break;
      case "gps": startGps(); break;
      case "test-voice-run": say("Kilometre 3. Split 5 21. Average 5 24.", true); beep(880, 0.15, 0.25); break;
      case "run-start": runStart(); break;
      case "run-pause": runPause(); break;
      case "run-skip": runSkip(); break;
      case "run-end": ui.confirmEnd = true; renderRun(); break;
      case "run-end-cancel": ui.confirmEnd = false; renderRun(); break;
      case "run-end-save": hush(); finishRun(Date.now(), false); break;
      case "run-end-discard": runDiscard(); break;
      case "lock": setLock(true); break;
      case "copy-run": copyText(runSummaryText(ui.lastRun), b); break;
      case "hl": setHl(b.getAttribute("data-hl")); break;
      case "gpx": exportGpx(); break;
      case "map-retry": if (MV.state === "failed") mapLoad(); break;
      // strength
      case "stype": ui.sType = b.getAttribute("data-type"); ui.preview = null; render(); break;
      case "fig-sex": S.fig = b.getAttribute("data-sex") === "f" ? "f" : "m"; saveStrength(); render(); break;
      case "preview": { const id = b.getAttribute("data-id"); ui.preview = ui.preview === id ? null : id; render(); break; }
      case "test-voice-lift": say("One. Two. Three. Rest. Next: bench press. 18 kilos each hand."); beep(620, 0.05, 0.15); break;
      case "lift-start": sStart(); break;
      case "lift-resume": sResume(); break;
      case "lift-close": sFinish(false, ""); break;
      case "lift-discard": sDiscard(); break;
      case "warm-next": hush(); sWarmNext(); break;
      case "lift-go": {
        if (needsWeight(C.k)) {
          const er = $("kgErr"); if (er) er.textContent = "Enter the weight you'll use, in kg." + (EX[SETS[C.k].ex].allowZero ? " Enter 0 for bodyweight." : "");
          const inp = $("kgInput"); if (inp) inp.focus();
          break;
        }
        sLead(C.k, "go", "");
        break;
      }
      case "skip-lead": sSkipLead(); break;
      case "add-rest": if (C && C.phase === "lead") { C.leadDur += 15; sFired = {}; saveStrength(); sPaintLead((Date.now() - C.t0) / 1000); } break;
      case "lift-pause": sPause(); break;
      case "stop-set": sStopSet(); break;
      case "minus": nudge(-STEP); break;
      case "plus": nudge(STEP); break;
      case "lift-end": ui.confirmEnd = true; render(); break;
      case "lift-end-cancel": ui.confirmEnd = false; render(); break;
      case "lift-end-save": hush(); sFinish(false, ""); break;
      case "copy-lift": copyText(liftSummaryText(ui.lastLift), b); break;
    }
  });
  app.addEventListener("change", (e) => {
    if (e.target.id === "rWeekSel") { const v = +e.target.value; ui.rWeek = v === Math.min(planWeek(), 10) ? null : v; render(); }
    if (e.target.id === "sWeekSel") { const v = +e.target.value; ui.sWeek = v === planWeek() ? null : v; ui.preview = null; render(); }
    if (e.target.id === "gpxTrim") {
      RT.trim = !!e.target.checked; rtStore(); gpxSay("");
      if (ui.gpx && ui.lastRoute) { const x = routeGpx(ui.lastRoute, RT.trim); if (x) ui.gpx.text = x; else ui.gpx = null; gpxPaintOut(); }
    }
  });
  app.addEventListener("input", (e) => {
    if (e.target.id === "kgInput" && C && SETS[C.k]) {
      C.weights[SETS[C.k].ex] = parseKg(e.target.value); saveStrength();
      const er = $("kgErr"); if (er) er.textContent = "";
    }
  });
  app.addEventListener("keydown", (e) => { if (e.target.id === "kgInput" && e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
  document.addEventListener("pointerdown", unlockAudio, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
    const gap = hiddenAt ? Date.now() - hiddenAt : 0;
    hiddenAt = 0;
    if (R && !R.done && ui.view === "run") {
      if (gap > 3000) say("Welcome back. The screen was off for " + spokenGap(gap) + ", so coaching paused.", true);
      wakeCheck(); runTick();
      if (R && !R.done && gap > 3000) { R.note = "The screen was off for " + fmtClock(gap) + ", so cues and GPS paused. Keep the screen on."; R.noteUntil = Date.now() + 60000; paintRun(Date.now()); }
    }
    if (C && ui.view === "lift") { wakeCheck(); sTick(); }
  });

  // =====================================================================
  // Rearranging the week (v2): the Move sheet, the Undo bar and dragging
  // =====================================================================
  // Both sit outside the page so a re-draw of home doesn't close them
  const wkSheetEl = document.createElement("div"), wkToastEl = document.createElement("div");
  wkSheetEl.className = "wk-sheet-wrap"; wkSheetEl.hidden = true;
  wkToastEl.className = "wk-toast"; wkToastEl.hidden = true; wkToastEl.setAttribute("role", "status");
  document.body.appendChild(wkSheetEl); document.body.appendChild(wkToastEl);
  let wkS = null, wkToastTimer = null, wkDragEndAt = 0, DRAG = null;
  const wkName = (id, w) => (id === "long" && w === 10 ? "The race" : WK_NAME[id]);
  // Warnings a move would add (to this week, or across into next week) that aren't there now, for either choice
  function wkNewWarnings(id, d) {
    const w = homeWeek(), key = (st) => { const o = []; wkWarnings(w, st).forEach((a, day) => a.forEach((m) => o.push(day + "|" + m))); return o; };
    const now = new Set(key()), out = [];
    (w <= 9 ? ["week", "every"] : ["week"]).forEach((sc) => key(wkApply(wkCopy(WK), w, id, d, sc)).forEach((k) => {
      const m = k.slice(k.indexOf("|") + 1);
      if (!now.has(k) && !out.includes(m)) out.push(m);
    }));
    return out;
  }
  function wkOpen(id, d) {
    const it = weekItems(homeWeek())[id];
    if (!it || it.fixed) return;
    wkS = { mode: "move", id: id, d: d == null ? null : d, at: Date.now() };
    wkSheetPaint();
  }
  function wkSheetPaint() {
    if (!wkS) { wkSheetEl.hidden = true; wkSheetEl.innerHTML = ""; return; }
    const w = homeWeek(), race = w === 10;
    let h = '<div class="wk-scrim" data-act="wk-cancel"></div><div class="wk-sheet" role="dialog" aria-modal="true" aria-labelledby="wkSheetTitle" tabindex="-1">';
    if (wkS.mode === "reset") {
      h += '<h2 class="wk-sheet-title" id="wkSheetTitle">Reset to plan</h2>';
      if (race) h += '<p class="soft">Put race week back as planned.</p><button type="button" class="btn primary" data-act="wk-reset-go" data-scope="week"' + (wkSameAsPlan(w) ? " disabled" : "") + ">This week only</button>";
      else h += '<p class="soft">This week only puts this week back as planned; your every-week moves carry on from next week. Every week clears all your moves.</p>' +
        '<button type="button" class="btn primary" data-act="wk-reset-go" data-scope="week"' + (wkSameAsPlan(w) ? " disabled" : "") + ">This week only</button>" +
        '<button type="button" class="btn" data-act="wk-reset-go" data-scope="all">Every week</button>';
    } else {
      const cur = wkDays(w)[wkS.id];
      h += '<h2 class="wk-sheet-title" id="wkSheetTitle">' + esc(wkName(wkS.id, w)) + '</h2><p class="soft">Now on ' + DAYS[cur] + ". Move it to:</p>";
      h += '<div class="wk-days" role="group" aria-label="Move to">' + DAYS3.map((x, d) => '<button type="button" data-act="wk-day" data-d="' + d + '" aria-pressed="' + (wkS.d === d) + '"' +
        (d === cur ? " disabled" : "") + ">" + x + (d === cur ? "<small>now</small>" : "") + "</button>").join("") + "</div>";
      if (wkS.d != null) {
        const nw = wkNewWarnings(wkS.id, wkS.d);
        h += nw.length ? '<p class="wk-warn-line">⚠︎ ' + esc(nw.join(". ")) + ".</p>" : '<p class="soft">That fits your training rules.</p>';
        h += '<button type="button" class="btn primary" data-act="wk-scope" data-scope="week">This week only</button>';
        if (race) h += '<p class="fine">Race week has its own layout, so moves here are for this week only.</p>';
        else h += '<button type="button" class="btn" data-act="wk-scope" data-scope="every">Every week from now</button>' +
          '<p class="fine">' + (w === 9 ? "Every week means week 9 here: race week keeps its own layout." : "Every week means weeks " + w + " to 9. Race week keeps its own layout.") + "</p>";
      }
    }
    h += '<button type="button" class="link-btn wk-cancel" data-act="wk-cancel">Cancel</button></div>';
    wkSheetEl.innerHTML = h; wkSheetEl.hidden = false;
    const sh = wkSheetEl.querySelector(".wk-sheet"); if (sh) { try { sh.focus({ preventScroll: true }); } catch (e) {} }
  }
  function wkSheetClose() { wkS = null; wkSheetPaint(); }
  wkSheetEl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b || !wkS || Date.now() - wkS.at < 400) return; // ignores the tap that opened it
    const act = b.getAttribute("data-act"), s = wkS;
    if (act === "wk-cancel") wkSheetClose();
    else if (act === "wk-day") { s.d = +b.getAttribute("data-d"); wkSheetPaint(); }
    else if (act === "wk-scope" && s.d != null) { wkSheetClose(); wkMove(s.id, s.d, b.getAttribute("data-scope")); }
    else if (act === "wk-reset-go") { wkSheetClose(); wkReset(b.getAttribute("data-scope")); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && wkS) wkSheetClose(); });
  function wkToast(msg, undo) {
    clearTimeout(wkToastTimer);
    wkToastEl.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? '<button type="button" data-act="wk-undo">Undo</button>' : "");
    wkToastEl.hidden = false;
    wkToastTimer = setTimeout(() => { wkToastEl.hidden = true; }, undo ? 10000 : 3000);
  }
  wkToastEl.addEventListener("click", (e) => { if (e.target.closest('[data-act="wk-undo"]')) wkUndoLast(); });
  function wkCommit(next, msg) {
    ui.wkUndo.push(wkCopy(WK)); if (ui.wkUndo.length > 30) ui.wkUndo.shift();
    WK = next; wkSave(); wkToast(msg, true); render();
  }
  function wkMove(id, d, scope) {
    const w = homeWeek(), every = scope === "every" && w <= 9;
    wkCommit(wkApply(wkCopy(WK), w, id, d, every ? "every" : "week"), wkName(id, w) + " moved to " + DAYS[d] + (every ? ", every week from now." : ", this week only."));
  }
  function wkReset(scope) {
    const w = homeWeek(), next = wkCopy(WK);
    if (scope === "all") { next.every = []; next.weeks = {}; }
    else {
      delete next.weeks[w];
      // every-week moves that have started would still show this week, so this week gets the plan's days as its own
      if (w <= 9 && next.every.some((r) => r.from <= w)) next.weeks[w] = Object.assign({}, WK_PLAN);
    }
    wkCommit(next, scope === "all" ? "All your moves are cleared." : "This week is back to the plan.");
  }
  function wkUndoLast() {
    if (!ui.wkUndo.length) return;
    WK = ui.wkUndo.pop(); wkSave(); wkToast("Undone.", false);
    if (ui.view === "home") render();
  }
  function wkLeaveHome() {
    ui.wkEdit = false;
    if (DRAG) wkDragEnd(null, true);
    if (wkS) wkSheetClose();
    clearTimeout(wkToastTimer); wkToastEl.hidden = true;
  }

  // Dragging from the ≡ handle with pointer events (HTML5 drag and drop isn't reliable on iPhone). The handle has
  // touch-action: none, so a touch that starts on it drags straight away and the rest of the page still scrolls normally.
  // The lifted session floats above your finger; the day under your finger lights up; near the top or bottom the page scrolls.
  // Letting go on another day opens the Move sheet with that day picked, so nothing changes until you choose.
  function wkDayAt(y) {
    const lis = document.querySelectorAll(".week-list li[data-day]");
    for (let i = 0; i < lis.length; i++) { const r = lis[i].getBoundingClientRect(); if (y >= r.top && y < r.bottom) return +lis[i].getAttribute("data-day"); }
    return null;
  }
  function wkDragPaint() {
    const D = DRAG, g = D && D.ghost;
    if (!g) return;
    const x = Math.max(8, Math.min(D.x - g.offsetWidth / 2, window.innerWidth - g.offsetWidth - 8)), y = D.y - g.offsetHeight - 30;
    g.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
    const d = wkDayAt(D.y);
    if (d === D.over) return;
    D.over = d;
    document.querySelectorAll(".week-list li.wk-over").forEach((li) => li.classList.remove("wk-over"));
    const li = d == null ? null : document.querySelector('.week-list li[data-day="' + d + '"]');
    if (li) li.classList.add("wk-over");
  }
  function wkDragFrame() {
    const D = DRAG;
    if (!D || !D.moved) return;
    const sc = D.scroller;
    if (sc) {
      const r = sc.getBoundingClientRect(), top = Math.max(r.top, 0), bot = Math.min(r.bottom, window.innerHeight), edge = 80;
      let v = 0;
      if (D.y < top + edge) v = -Math.min(18, (top + edge - D.y) / edge * 18);
      else if (D.y > bot - edge) v = Math.min(18, (D.y - (bot - edge)) / edge * 18);
      if (v) { const was = sc.scrollTop; sc.scrollTop = was + v; if (sc.scrollTop !== was) { D.over = -1; wkDragPaint(); } }
    }
    D.raf = requestAnimationFrame(wkDragFrame);
  }
  function wkDragStart(e, handle) {
    const id = handle.getAttribute("data-id"), item = handle.closest(".wk-item");
    if (!id || !item) return;
    e.preventDefault(); // no text selection or iOS callout menu
    try { handle.setPointerCapture(e.pointerId); } catch (x) {}
    DRAG = { id: id, pid: e.pointerId, handle: handle, item: item, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, moved: false, over: null,
             ghost: null, raf: 0, scroller: app.querySelector(".view.scroll"), from: wkDays(homeWeek())[id] };
  }
  function wkDragMove(e) {
    const D = DRAG;
    if (!D || e.pointerId !== D.pid) return;
    e.preventDefault();
    D.x = e.clientX; D.y = e.clientY;
    if (!D.moved) {
      if (Math.hypot(D.x - D.x0, D.y - D.y0) < 6) return;
      D.moved = true;
      const g = document.createElement("div"), nm = D.item.querySelector(".wk-name");
      g.className = "wk-ghost"; g.setAttribute("aria-hidden", "true"); g.textContent = nm ? nm.textContent : WK_NAME[D.id];
      document.body.appendChild(g); D.ghost = g;
      D.item.classList.add("wk-src"); document.body.classList.add("wk-dragging");
      D.raf = requestAnimationFrame(wkDragFrame);
    }
    wkDragPaint();
  }
  function wkDragEnd(e, cancel) {
    const D = DRAG;
    if (!D || (e && e.pointerId !== D.pid)) return;
    DRAG = null; wkDragEndAt = Date.now();
    cancelAnimationFrame(D.raf);
    if (D.ghost) D.ghost.remove();
    D.item.classList.remove("wk-src"); document.body.classList.remove("wk-dragging");
    document.querySelectorAll(".week-list li.wk-over").forEach((li) => li.classList.remove("wk-over"));
    try { D.handle.releasePointerCapture(D.pid); } catch (x) {}
    if (cancel) return;
    if (!D.moved) { wkOpen(D.id, null); return; } // a tap on the handle: pick a day from the list
    const d = wkDayAt(D.y);
    if (d != null && d !== D.from) wkOpen(D.id, d);
  }
  app.addEventListener("pointerdown", (e) => {
    const h = e.target.closest(".wk-handle");
    if (!h || !ui.wkEdit || DRAG || wkS || e.isPrimary === false || (e.pointerType === "mouse" && e.button !== 0)) return;
    wkDragStart(e, h);
  });
  document.addEventListener("pointermove", wkDragMove, { passive: false });
  document.addEventListener("pointerup", (e) => wkDragEnd(e, false));
  document.addEventListener("pointercancel", (e) => wkDragEnd(e, true));
  document.addEventListener("touchmove", (e) => { if (DRAG) e.preventDefault(); }, { passive: false }); // the page stays still while you drag
  app.addEventListener("contextmenu", (e) => { if (e.target.closest(".week-list.editing")) e.preventDefault(); });

  window.addEventListener("hashchange", render);
  if (TEST) window.__v2 = { rtEncode: rtEncode, rtDecode: rtDecode, rtSimplify: rtSimplify, rtUnpack: rtUnpack, routeGeo: routeGeo, routeGpx: routeGpx, ui: ui, MV: MV, RT: () => RT, RS: () => RS, openRun: openRun,
    WK: () => WK, wkWarnings: wkWarnings, weekSchedule: weekSchedule, wkDays: wkDays, defaultRunKind: defaultRunKind, defaultEasyVar: defaultEasyVar, defaultType: defaultType, nextHint: nextHint };

  // Back on the finish screen that was open if the page was reloaded (see OPEN_KEY)
  let reopened = false;
  try {
    const o = JSON.parse(sessionStorage.getItem(OPEN_KEY) || "null");
    if (o && o.id && Date.now() - o.at < 30 * 60000 && !C && location.hash !== "#figures") reopened = openRun(o.id, o.from === "runs" ? "runs" : "finish");
  } catch (e) {}
  if (!reopened) render();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
