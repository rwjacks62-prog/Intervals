<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength">
<meta name="theme-color" content="#F2F4F1">
<title>Sub-41 Strength Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen gym coach. Start screen holds the plan; in a session one exercise fills the screen with a moving figure in time with the count. Blue = working set, sage = rest, neutral = getting ready. */
:root {
  --ink: #1A1D2E;
  --ink-soft: #4F566B;
  --line: #CBD0DA;
  --surface: #F2F4F1;
  --card: #FFFFFF;
  --accent: #2340F0;
  --on-accent: #FFFFFF;
  --work: #2340F0;
  --on-work: #FFFFFF;
  --on-work-soft: rgba(255, 255, 255, 0.84);
  --work-card: rgba(255, 255, 255, 0.14);
  --rest: #D8E4DE;
  --rest-card: #EDF3EF;
  --on-rest: #1A1D2E;
  --on-rest-soft: #46524D;
  --chip: #DDE3FC;
  --warn: #9A4A12;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E8EBF2;
    --ink-soft: #A2A9BD;
    --line: #2F3447;
    --surface: #141724;
    --card: #1D2132;
    --accent: #3D58F6;
    --work: #2038D8;
    --rest: #17251F;
    --rest-card: #1F3129;
    --on-rest: #E3EDE8;
    --on-rest-soft: #9FB3AA;
    --chip: #283163;
    --warn: #F2A46B;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  --bg: var(--surface);
  --fg: var(--ink);
  --fg-soft: var(--ink-soft);
  --panel: var(--card);
  height: 100%;
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.3s ease, color 0.3s ease;
}
body[data-phase="set"] { --bg: var(--work); --fg: var(--on-work); --fg-soft: var(--on-work-soft); --panel: var(--work-card); }
body[data-phase="rest"],
body[data-phase="done"] { --bg: var(--rest); --fg: var(--on-rest); --fg-soft: var(--on-rest-soft); --panel: var(--rest-card); }

#app {
  height: 100%;
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
p { margin: 0; }
h1, h2, h3 { margin: 0; }
.soft { color: var(--fg-soft); }

/* Controls */
button, select, input { font: inherit; color: inherit; }
.btn {
  appearance: none;
  font-weight: 700;
  font-size: 1.05rem;
  min-height: 3.25rem;
  padding: 0 1rem;
  border-radius: 0.875rem;
  border: 2px solid var(--fg);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
body[data-phase="set"] .btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.wide { width: 100%; min-height: 4rem; font-size: 1.25rem; }
.btn.small { min-height: 2.75rem; font-size: 0.95rem; padding: 0 0.9rem; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.link-btn {
  appearance: none;
  background: none;
  border: 0;
  padding: 0.5rem 0.25rem;
  min-height: 2.75rem;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 0.2em;
  cursor: pointer;
  touch-action: manipulation;
}
.btn:focus-visible, .link-btn:focus-visible, .seg button:focus-visible, select:focus-visible, .row:focus-visible, .step-btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
body[data-phase="set"] .btn:focus-visible, body[data-phase="set"] .step-btn:focus-visible { outline-color: var(--fg); }

.label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-soft); }
.seg { display: flex; border: 2px solid var(--fg); border-radius: 0.75rem; overflow: hidden; }
.seg button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  min-height: 2.75rem;
  padding: 0 0.3rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  font-variant-numeric: tabular-nums;
}
.seg button + button { border-left: 2px solid var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.select-wrap { position: relative; }
.select-wrap::after {
  content: "";
  position: absolute;
  right: 0.9rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--fg);
  border-bottom: 2px solid var(--fg);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  font-weight: 700;
  min-height: calc(2.75rem + 4px);
  padding: 0 2.25rem 0 0.75rem;
  border: 2px solid var(--fg);
  border-radius: 0.75rem;
  background: transparent;
}

/* Figure */
.fig { color: var(--fg); display: flex; justify-content: center; }
.fig svg { display: block; width: 100%; height: 100%; max-width: 100%; }
.fig-start { height: 11rem; margin: 0.25rem 0 0.5rem; }

/* Start */
.start { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 1.4rem; padding-top: 1.25rem; }
.title {
  margin-top: 0.35rem;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 3.5rem;
  font-size: clamp(3rem, 15vw, 5.5rem);
  line-height: 0.85;
  letter-spacing: -0.01em;
}
.lede { margin-top: 0.6rem; color: var(--fg-soft); max-width: 38ch; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.week-note { font-size: 0.95rem; color: var(--fg-soft); margin-top: -0.75rem; }
.notice, .panel { background: var(--panel); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
.notice-title, .status { font-weight: 700; }
.notice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.panel-row > div { min-width: 0; }
.status-note { font-size: 0.9rem; color: var(--fg-soft); }
.plan { display: flex; flex-direction: column; gap: 1.1rem; }
.pair { border-top: 3px solid var(--fg); padding-top: 0.35rem; }
.pair-head { display: flex; justify-content: space-between; }
.row {
  appearance: none;
  width: 100%;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  display: grid;
  grid-template-columns: 2.4rem minmax(0, 1fr) auto;
  gap: 0.5rem;
  align-items: baseline;
  padding: 0.55rem 0;
  cursor: pointer;
  touch-action: manipulation;
}
.pair .row:last-of-type { border-bottom: 0; }
.row .tag { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1; }
.row .nm { font-weight: 600; min-width: 0; }
.row .dose { display: block; font-weight: 400; font-size: 0.9rem; color: var(--fg-soft); }
.row .kg { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .kg .soft { font-weight: 500; font-size: 0.9rem; }
.row[aria-expanded="true"] .nm { text-decoration: underline; text-underline-offset: 0.2em; }
.chip { display: inline-block; margin-left: 0.3rem; padding: 0.05rem 0.45rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--chip); color: var(--fg); vertical-align: 0.1em; }
.tap-hint { font-size: 0.85rem; color: var(--fg-soft); margin-top: -0.6rem; }
.history h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; margin-bottom: 0.4rem; }
.history details { border-top: 1px solid var(--line); }
.history details:last-of-type { border-bottom: 1px solid var(--line); }
.history summary { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; min-height: 2.75rem; cursor: pointer; list-style: none; font-weight: 600; }
.history summary::-webkit-details-marker { display: none; }
.history summary .soft { font-weight: 500; white-space: nowrap; }
.history ul { list-style: none; margin: 0 0 0.75rem; padding: 0; font-size: 0.92rem; }
.history li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.15rem 0; font-variant-numeric: tabular-nums; }
.history li span:first-child { color: var(--fg-soft); min-width: 0; }
.history li span:last-child { font-weight: 600; white-space: nowrap; }
.fine { font-size: 0.85rem; color: var(--fg-soft); }
.sticky-bar { position: sticky; bottom: 0; margin-top: auto; padding: 0.75rem 0 1rem; background: var(--bg); }

/* Session */
.run { padding-top: 0.4rem; }
.run-top { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
.run-top .meta { font-size: 0.85rem; font-weight: 600; color: var(--fg-soft); font-variant-numeric: tabular-nums; text-align: right; line-height: 1.3; }
.prog { height: 0.35rem; border-radius: 0.2rem; background: rgba(127, 127, 127, 0.28); overflow: hidden; margin-top: 0.25rem; }
.prog > div { height: 100%; background: var(--fg); transform-origin: left center; }
.banner { margin-top: 0.5rem; background: var(--panel); border-radius: 0.75rem; padding: 0.55rem 0.8rem; font-size: 0.9rem; font-weight: 600; }
.stage { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
.stage-inner { margin-block: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-block: 0.75rem; }
.tagline { display: flex; align-items: center; gap: 0.6rem; font-weight: 600; color: var(--fg-soft); flex-wrap: wrap; }
.tag-pill { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1; padding: 0.3rem 0.55rem 0.25rem; border-radius: 0.5rem; background: var(--fg); color: var(--bg); }
.ex-name { font-family: var(--font-display); font-weight: 800; font-size: 2.3rem; font-size: clamp(2rem, 9vw, 3rem); line-height: 0.95; text-wrap: balance; }
.cue { color: var(--fg-soft); font-weight: 500; }
.fig-set { height: clamp(9.5rem, 27vh, 15rem); }
.fig-next { height: clamp(8rem, 21vh, 12rem); }
.counter { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.counter .num { font-family: var(--font-display); font-weight: 900; font-size: 6.5rem; font-size: clamp(5.5rem, 28vw, 8.5rem); line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.counter .of { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--fg-soft); }
.counter .side { font-weight: 700; margin-left: auto; text-align: right; }
.extra { font-weight: 700; }
body.is-paused .counter .num, body.is-paused .count-big { opacity: 0.35; }
.bar { height: 0.55rem; border-radius: 0.3rem; background: rgba(127, 127, 127, 0.28); overflow: hidden; }
.bar > div { height: 100%; background: var(--fg); transform-origin: left center; transform: scaleX(0); }
.count-big { font-family: var(--font-display); font-weight: 900; font-size: 6rem; font-size: clamp(5rem, 26vw, 8rem); line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.lead-word { font-weight: 700; font-size: 1.1rem; color: var(--fg-soft); }
.next-card { background: var(--panel); border-radius: 1rem; padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.45rem; }
.next-card .ex-name { font-size: 2rem; }
.weight { display: flex; flex-direction: column; gap: 0.35rem; }
.stepper { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr) 3.25rem; align-items: center; gap: 0.5rem; }
.step-btn {
  height: 3.25rem;
  border-radius: 0.875rem;
  border: 2px solid var(--fg);
  background: transparent;
  font-size: 1.8rem;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
}
.kg-wrap { display: flex; align-items: baseline; justify-content: center; gap: 0.3rem; min-width: 0; }
.kg-input {
  width: 4ch;
  min-width: 0;
  padding: 0;
  border: 0;
  border-bottom: 3px solid var(--fg);
  border-radius: 0;
  background: transparent;
  color: var(--fg);
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 3.25rem;
  line-height: 1;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.kg-input::placeholder { color: var(--fg-soft); opacity: 0.6; }
.kg-unit { font-weight: 700; }
.weight-note { font-size: 0.9rem; color: var(--fg-soft); }
.err { color: var(--warn); font-weight: 700; font-size: 0.95rem; }
.err:empty { display: none; }
.set-weight { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; background: var(--panel); border-radius: 0.875rem; padding: 0.5rem 0.6rem 0.5rem 0.9rem; }
.set-weight strong { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.set-weight .mini { display: flex; gap: 0.4rem; }
.set-weight .step-btn { height: 2.75rem; width: 2.75rem; font-size: 1.5rem; }
.swap { font-size: 0.9rem; font-weight: 600; color: var(--warn); }
body[data-phase="set"] .swap { color: var(--fg); }
.warm-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.warm-list li { padding: 0.8rem 1rem; background: var(--panel); border-radius: 0.75rem; font-weight: 600; }
.controls { display: grid; gap: 0.6rem; padding: 0.5rem 0 1rem; }
.controls.two { grid-template-columns: 1fr 1.5fr; }
.confirm { background: var(--panel); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
.confirm .q { font-weight: 700; font-size: 1.1rem; }
.confirm .link-btn { align-self: center; }

/* Done */
.done { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 1.1rem; padding-top: 1.75rem; }
.done-title { font-family: var(--font-display); font-weight: 900; font-size: 5rem; font-size: clamp(4rem, 22vw, 7rem); line-height: 0.8; }
.done-meta { font-weight: 600; font-size: 1.1rem; }
.summary { list-style: none; margin: 0; padding: 0; }
.summary li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-top: 1px solid rgba(127, 127, 127, 0.35); }
.summary li span:first-child { min-width: 0; }
.summary li span:last-child { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.done-next { color: var(--fg-soft); max-width: 40ch; }
.copy-box { width: 100%; min-height: 8rem; font: 0.85rem/1.4 ui-monospace, Menlo, monospace; border-radius: 0.75rem; border: 1px solid var(--line); padding: 0.6rem; background: var(--panel); color: var(--fg); }

/* Figure gallery (test view) */
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 1rem 0; overflow-y: auto; }
.gallery div { border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.25rem; font-size: 0.75rem; }
.gallery .fig { height: 8rem; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (max-width: 360px) { .fields { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body data-phase="idle">
<main id="app"></main>
<p id="live" class="sr-only" aria-live="polite"></p>

<script>
(() => {
  "use strict";

  const EX = {

  };
  const WARMUP = ["Glute bridge × 12", "90/90 hip switches × 6 per side", "Dead bug × 6 per side"];
  const SWITCH = { leg: "Switch legs.", arm: "Switch arms.", side: "Switch sides.", hand: "Switch hands." };

  // ---------- Figures ----------
  // Side-view figure: poses set the hip, torso angle, ankle targets and hand targets; knees and elbows are solved.

  const sh = (x, y, b) => ({ to: "sh", p: [x, y], b: b == null ? 1 : b });

  const BENCH = (x, y, w) => [["r", x, y, w, 8], ["l", x + 7, y + 8, x + 7, 158, 6], ["l", x + w - 7, y + 8, x + w - 7, 158, 6]];

    row1: { tempo: [1, 2], bench: BENCH(160, 118, 58), db: ["n"], p: [
      { hip: [100, 92], torso: -25, n: [114, 154, 5], f: [86, 154, 5], an: sh(0, 50), af: ab(172, 116) },
      { hip: [100, 92], torso: -25, n: [114, 154, 5], f: [86, 154, 5], an: sh(-24, 16), af: ab(172, 116) }] },

              if (r === p.max && !last) txt += " " + switchText(ex);

          }
        }
      }
      if (e >= total) {

        finishSet(p.timed ? null : p.max, late ? "" : (p.timed ? "Done." : p.max + "."), late);

      }

    }
    paintClock();
  }

  function finishSet(reps, prefix, late) {
    const st = SETS[C.k], ex = EX[st.ex];
    C.sets.push({ ex: st.ex, set: st.set, kg: ex.load === "none" ? null : C.weights[st.ex], reps: reps });

  function togglePause() {

  function finishSession(complete, prefix) {

  // ---------- Rendering ----------

  function perExercise(rec) {

  // ---------- Figure animation ----------
  function animate() {
    const figs = document.querySelectorAll("[data-fig]");
    const now = performance.now() / 1000;
    figs.forEach((el) => {
      const key = el.getAttribute("data-fig"), mode = el.getAttribute("data-mode");

      } else {

  app.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    unlockAudio();
    switch (b.getAttribute("data-act")) {
      case "type": ui.type = b.getAttribute("data-type"); ui.preview = null; render(); break;
      case "rest-opt": S.rest = +b.getAttribute("data-rest"); save(); render(); break;
      case "preview": { const id = b.getAttribute("data-id"); ui.preview = ui.preview === id ? null : id; render(); break; }
      case "test-voice": say("One. Two. Three. Rest. Next: bench press. 18 kilos each hand."); beep(620, 0.05, 0.15); break;
      case "start": startSession(); break;
      case "resume": resumeSession(); break;
      case "close-saved": finishSession(false, ""); break;
      case "discard": discardSession(); break;
      case "warm-done": beginLead(0, "ready", ""); break;
      case "go": {
        if (needsWeight(C.k)) {
          const er = $("kgErr"); if (er) er.textContent = "Enter the weight you'll use, in kg." + (EX[SETS[C.k].ex].allowZero ? " Enter 0 for bodyweight." : "");
          const inp = $("kgInput"); if (inp) inp.focus();
          break;
        }
        beginLead(C.k, "go", "");
        break;
      }
      case "skip-lead": skipLead(); break;
      case "add-rest": addRest(); paintLead((Date.now() - C.t0) / 1000); break;
      case "pause": togglePause(); break;
      case "stop-set": stopSet(); break;
      case "minus": nudge(-STEP); break;
      case "plus": nudge(STEP); break;
      case "end": ui.confirmEnd = true; render(); break;
      case "end-cancel": ui.confirmEnd = false; render(); break;
      case "end-save": hush(); finishSession(false, ""); break;
      case "end-discard": discardSession(); break;
      case "copy": {
        const text = summaryText(ui.lastDone);
        const fallback = () => { ui.copyText = text; render(); const box = $("copyBox"); if (box) { box.focus(); box.select(); } };
        try { navigator.clipboard.writeText(text).then(() => { b.textContent = "Copied"; }, fallback); } catch (err) { fallback(); }
        break;
      }
      case "home": ui.view = "start"; ui.lastDone = null; ui.week = null; ui.type = null; render(); app.scrollTop = 0; break;
    }
  });
  app.addEventListener("change", (e) => {
    if (e.target.id === "weekSel") { const v = +e.target.value; ui.week = v === currentWeek() ? null : v; ui.preview = null; render(); }
  });
  app.addEventListener("input", (e) => {
    if (e.target.id === "kgInput" && C) {
      const id = currentWeightId(); if (!id) return;
      C.weights[id] = parseKg(e.target.value); save();
      const er = $("kgErr"); if (er) er.textContent = "";
    }
  });
  app.addEventListener("keydown", (e) => { if (e.target.id === "kgInput" && e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
  document.addEventListener("pointerdown", unlockAudio, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && C && ui.view === "run") { requestWake(); tick(); }
  });
  window.addEventListener("hashchange", render);

  render();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
