<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#F2F4F1">
<title>Sub-41 Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen training app. Home shows today and the week; each workout fills the screen in a colour you can read at a glance: blue = hard effort, sage = rest, neutral = easy running and getting ready. */
:root {
  --ink: #1A1D2E;
  --ink-soft: #4F566B;
  --line: #CBD0DA;
  --surface: #F2F4F1;
  --card: #FFFFFF;
  --accent: #2340F0;
  --on-accent: #FFFFFF;
  --work: #2340F0;
  --on-work: #FFFFFF;
  --on-work-soft: rgba(255, 255, 255, 0.84);
  --work-card: rgba(255, 255, 255, 0.14);
  --rest: #D8E4DE;
  --rest-card: #EDF3EF;
  --on-rest: #1A1D2E;
  --on-rest-soft: #46524D;
  --chip: #DDE3FC;
  --fast: #FFC94A;
  --slow: #FF9B8A;
  --ok: #FFFFFF;
  --chip-ink: #1A1D2E;
  --warn: #9A4A12;
  --good: #1E7A4C;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E8EBF2;
    --ink-soft: #A2A9BD;
    --line: #2F3447;
    --surface: #141724;
    --card: #1D2132;
    --accent: #3D58F6;
    --work: #2038D8;
    --rest: #17251F;
    --rest-card: #1F3129;
    --on-rest: #E3EDE8;
    --on-rest-soft: #9FB3AA;
    --chip: #283163;
    --warn: #F2A46B;
    --good: #6FD39C;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  --bg: var(--surface);
  --fg: var(--ink);
  --fg-soft: var(--ink-soft);
  --panel: var(--card);
  height: 100%;
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.3s ease, color 0.3s ease;
}
body[data-phase="work"] { --bg: var(--work); --fg: var(--on-work); --fg-soft: var(--on-work-soft); --panel: var(--work-card); }
body[data-phase="rest"],
body[data-phase="done"] { --bg: var(--rest); --fg: var(--on-rest); --fg-soft: var(--on-rest-soft); --panel: var(--rest-card); }

#app {
  height: 100%;
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
p { margin: 0; }
h1, h2, h3 { margin: 0; }
.soft { color: var(--fg-soft); }

/* Controls */
button, select, input { font: inherit; color: inherit; }
.btn {
  appearance: none;
  font-weight: 700;
  font-size: 1.05rem;
  min-height: 3.25rem;
  padding: 0 1rem;
  border-radius: 0.875rem;
  border: 2px solid var(--fg);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
body[data-phase="work"] .btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.wide { width: 100%; min-height: 4rem; font-size: 1.25rem; }
.btn.small { min-height: 2.75rem; font-size: 0.95rem; padding: 0 0.9rem; white-space: nowrap; }
.btn:disabled { opacity: 0.4; }
.btn:active { transform: translateY(1px); }
.link-btn {
  appearance: none;
  background: none;
  border: 0;
  padding: 0.5rem 0.25rem;
  min-height: 2.75rem;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 0.2em;
  cursor: pointer;
  touch-action: manipulation;
}
.btn:focus-visible, .link-btn:focus-visible, .seg button:focus-visible, select:focus-visible, .row:focus-visible, .step-btn:focus-visible, input:focus-visible, .unlock:focus-visible, .choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
body[data-phase="work"] .btn:focus-visible, body[data-phase="work"] .step-btn:focus-visible { outline-color: var(--fg); }

.label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-soft); }
.seg { display: flex; border: 2px solid var(--fg); border-radius: 0.75rem; overflow: hidden; }
.seg button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  min-height: 2.75rem;
  padding: 0 0.3rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  font-variant-numeric: tabular-nums;
}
.seg button + button { border-left: 2px solid var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.select-wrap { position: relative; }
.select-wrap::after {
  content: "";
  position: absolute;
  right: 0.9rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--fg);
  border-bottom: 2px solid var(--fg);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  font-weight: 700;
  min-height: calc(2.75rem + 4px);
  padding: 0 2.25rem 0 0.75rem;
  border: 2px solid var(--fg);
  border-radius: 0.75rem;
  background: transparent;
}
.field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

/* Screens with a list (home, setup, history) */
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 1.4rem; padding-top: 1rem; }
.scroll > *, .done > *, .stage-inner > * { flex-shrink: 0; }
.back { align-self: flex-start; margin: -0.25rem 0 -0.75rem; }
.title {
  margin-top: 0.35rem;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 3.5rem;
  font-size: clamp(3rem, 15vw, 5.5rem);
  line-height: 0.85;
  letter-spacing: -0.01em;
}
.lede { margin-top: 0.6rem; color: var(--fg-soft); max-width: 38ch; }
.panel, .notice { background: var(--panel); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.panel-row > div { min-width: 0; }
.status, .notice-title { font-weight: 700; }
.status-note { font-size: 0.9rem; color: var(--fg-soft); }
.notice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.4rem; background: var(--fg-soft); vertical-align: 0.05em; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.fine { font-size: 0.85rem; color: var(--fg-soft); }
.sticky-bar { position: sticky; bottom: 0; margin-top: auto; padding: 0.75rem 0 1rem; background: var(--bg); }
.chip { display: inline-block; margin-left: 0.3rem; padding: 0.05rem 0.45rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--chip); color: var(--fg); vertical-align: 0.1em; }

/* Home */
.today { display: flex; flex-direction: column; gap: 0.6rem; }
.today-item { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; background: var(--panel); border-radius: 1rem; padding: 0.85rem 0.9rem 0.85rem 1rem; }
.today-item > div { min-width: 0; }
.today-item .what { font-weight: 700; font-size: 1.1rem; line-height: 1.25; }
.today-item .sub { font-size: 0.9rem; color: var(--fg-soft); }
.done-tag { font-weight: 700; color: var(--good); white-space: nowrap; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.choice {
  appearance: none;
  border: 2px solid var(--fg);
  border-radius: 1rem;
  background: transparent;
  padding: 0.9rem 1rem 1rem;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  min-height: 7rem;
}
.choice .big-word { font-family: var(--font-display); font-weight: 900; font-size: 2.6rem; line-height: 0.9; }
.choice .sub { font-size: 0.9rem; color: var(--fg-soft); }
.week-list { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--fg); }
.week-list li { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 0.5rem; align-items: baseline; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.week-list .d { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1; }
.week-list .w { min-width: 0; }
.week-list .w > span { display: block; }
.week-list .w .muted { color: var(--fg-soft); }
.week-list .tick { font-weight: 700; color: var(--good); white-space: nowrap; }
.week-list li.is-today .d { color: var(--accent); }
.week-list li.is-today { background: linear-gradient(90deg, var(--panel), transparent); }
.section-title { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; margin-bottom: 0.4rem; }

/* Run setup and strength plan */
.session { display: flex; flex-direction: column; gap: 0.8rem; }
.session-name { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 0.9; text-wrap: balance; }
.session-sub { color: var(--fg-soft); }
.steps { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--fg); }
.steps li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: baseline; padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
.steps .what { font-weight: 600; min-width: 0; }
.steps .what span { display: block; font-weight: 400; font-size: 0.92rem; color: var(--fg-soft); }
.steps .how { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.total { font-weight: 600; color: var(--fg-soft); }
.plan { display: flex; flex-direction: column; gap: 1.1rem; }
.pair { border-top: 3px solid var(--fg); padding-top: 0.35rem; }
.pair-head { display: flex; justify-content: space-between; }
.row {
  appearance: none;
  width: 100%;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  display: grid;
  grid-template-columns: 2.4rem minmax(0, 1fr) auto;
  gap: 0.5rem;
  align-items: baseline;
  padding: 0.55rem 0;
  cursor: pointer;
  touch-action: manipulation;
}
.pair .row:last-of-type { border-bottom: 0; }
.row .tag { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1; }
.row .nm { font-weight: 600; min-width: 0; }
.row .dose { display: block; font-weight: 400; font-size: 0.9rem; color: var(--fg-soft); }
.row .kg { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .kg .soft { font-weight: 500; font-size: 0.9rem; }
.row[aria-expanded="true"] .nm { text-decoration: underline; text-underline-offset: 0.2em; }
.tap-hint { font-size: 0.85rem; color: var(--fg-soft); margin-top: -0.6rem; }
.week-note { font-size: 0.95rem; color: var(--fg-soft); margin-top: -0.75rem; }
.history details { border-top: 1px solid var(--line); }
.history details:last-of-type { border-bottom: 1px solid var(--line); }
.history summary { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; min-height: 2.75rem; cursor: pointer; list-style: none; font-weight: 600; }
.history summary::-webkit-details-marker { display: none; }
.history summary .soft { font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.history ul { list-style: none; margin: 0 0 0.75rem; padding: 0; font-size: 0.92rem; }
.history li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.15rem 0; font-variant-numeric: tabular-nums; }
.history li span:first-child { color: var(--fg-soft); min-width: 0; }
.history li span:last-child { font-weight: 600; white-space: nowrap; }

/* Figure */
.fig { color: var(--fg); display: flex; justify-content: center; }
.fig svg { display: block; width: 100%; height: 100%; max-width: 100%; }
.fig-start { height: 11rem; margin: 0.25rem 0 0.5rem; }
.fig-set { height: clamp(9.5rem, 27vh, 15rem); }
.fig-next { height: clamp(8rem, 21vh, 12rem); }

/* Live workout */
.run { padding-top: 0.4rem; }
.run-top { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; min-height: 2.75rem; }
.run-top .run-title { font-weight: 700; min-width: 0; }
.run-top .meta { font-size: 0.85rem; font-weight: 600; color: var(--fg-soft); font-variant-numeric: tabular-nums; text-align: right; line-height: 1.3; white-space: nowrap; }
.prog { height: 0.35rem; border-radius: 0.2rem; background: rgba(127, 127, 127, 0.28); overflow: hidden; margin-top: 0.25rem; }
.prog > div { height: 100%; background: var(--fg); transform-origin: left center; }
.segs { display: flex; gap: 2px; align-items: center; height: 0.9rem; margin-top: 0.25rem; }
.segs span { height: 0.45rem; border-radius: 1px; background: var(--fg); opacity: 0.22; min-width: 2px; }
.segs span.w { height: 0.65rem; }
.segs span.done { opacity: 0.65; }
.segs span.now { opacity: 1; height: 0.9rem; }
.banner { margin-top: 0.5rem; background: var(--panel); border-radius: 0.75rem; padding: 0.55rem 0.8rem; font-size: 0.9rem; font-weight: 600; }
.stage { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
.stage-inner { margin-block: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-block: 0.75rem; }
.phase-name { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; font-size: clamp(2.3rem, 11vw, 3.4rem); line-height: 0.92; }
.phase-sub { font-weight: 600; color: var(--fg-soft); }
.count { display: flex; align-items: baseline; gap: 0.5rem; margin: 0.2rem 0 0; font-family: var(--font-display); font-weight: 900; font-size: 7rem; font-size: clamp(5.5rem, 31vw, 9.5rem); line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.count small { font-family: var(--font-ui); font-size: 1.1rem; font-weight: 700; letter-spacing: 0; }
body.is-paused .count, body.is-paused .counter .num, body.is-paused .count-big { opacity: 0.35; }
.bar { height: 0.55rem; border-radius: 0.3rem; background: rgba(127, 127, 127, 0.28); overflow: hidden; }
.bar > div { height: 100%; background: var(--fg); transform-origin: left center; transform: scaleX(0); }
.detail { font-weight: 600; font-variant-numeric: tabular-nums; }
.pace-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.pace-box { background: var(--panel); border-radius: 0.875rem; padding: 0.7rem 0.85rem; display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.pace-val { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pace-val small { font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600; }
.pace-val.window { font-size: 1.75rem; line-height: 1.15; }
.call { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; border-radius: 0.875rem; padding: 0.7rem 0.9rem; background: var(--ok); color: var(--chip-ink); font-weight: 700; }
.call.fast { background: var(--fast); }
.call.slow { background: var(--slow); }
.call .call-word { font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; }
.call .call-meta { font-variant-numeric: tabular-nums; white-space: nowrap; }
.next { font-weight: 600; }
.next span { font-weight: 400; color: var(--fg-soft); }
.controls { display: grid; gap: 0.6rem; padding: 0.5rem 0 0.5rem; }
.controls.two { grid-template-columns: 1fr 1.5fr; }
.controls.three { grid-template-columns: 1fr 1fr 1fr; }
.controls.last { padding-bottom: 1rem; }
.gps-line { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 0.85rem; font-weight: 600; color: var(--fg-soft); padding-bottom: 0.75rem; font-variant-numeric: tabular-nums; }
.gps-line .link-btn { padding: 0; min-height: 2rem; }
body.locked .controls, body.locked .gps-line { visibility: hidden; }
.confirm { background: var(--panel); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
.confirm .q { font-weight: 700; font-size: 1.1rem; }
.confirm .link-btn { align-self: center; }

/* Strength session */
.tagline { display: flex; align-items: center; gap: 0.6rem; font-weight: 600; color: var(--fg-soft); flex-wrap: wrap; }
.tag-pill { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1; padding: 0.3rem 0.55rem 0.25rem; border-radius: 0.5rem; background: var(--fg); color: var(--bg); }
.ex-name { font-family: var(--font-display); font-weight: 800; font-size: 2.3rem; font-size: clamp(2rem, 9vw, 3rem); line-height: 0.95; text-wrap: balance; }
.cue { color: var(--fg-soft); font-weight: 500; }
.counter { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.counter .num { font-family: var(--font-display); font-weight: 900; font-size: 6.5rem; font-size: clamp(5.5rem, 28vw, 8.5rem); line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.counter .of { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--fg-soft); }
.counter .side { font-weight: 700; margin-left: auto; text-align: right; }
.extra { font-weight: 700; }
.extra:empty { display: none; }
.count-big { font-family: var(--font-display); font-weight: 900; font-size: 6rem; font-size: clamp(5rem, 26vw, 8rem); line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.lead-word { font-weight: 700; font-size: 1.1rem; color: var(--fg-soft); }
.next-card { background: var(--panel); border-radius: 1rem; padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.45rem; }
.next-card .ex-name { font-size: 2rem; }
.weight { display: flex; flex-direction: column; gap: 0.35rem; }
.stepper { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr) 3.25rem; align-items: center; gap: 0.5rem; }
.step-btn { height: 3.25rem; border-radius: 0.875rem; border: 2px solid var(--fg); background: transparent; font-size: 1.8rem; font-weight: 600; line-height: 1; cursor: pointer; touch-action: manipulation; }
.kg-wrap { display: flex; align-items: baseline; justify-content: center; gap: 0.3rem; min-width: 0; }
.kg-input { width: 4ch; min-width: 0; padding: 0; border: 0; border-bottom: 3px solid var(--fg); border-radius: 0; background: transparent; color: var(--fg); font-family: var(--font-display); font-weight: 900; font-size: 3.25rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.kg-input::placeholder { color: var(--fg-soft); opacity: 0.6; }
.kg-unit { font-weight: 700; }
.weight-note { font-size: 0.9rem; color: var(--fg-soft); }
.err { color: var(--warn); font-weight: 700; font-size: 0.95rem; }
.err:empty { display: none; }
.set-weight { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; background: var(--panel); border-radius: 0.875rem; padding: 0.5rem 0.6rem 0.5rem 0.9rem; }
.set-weight strong { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.set-weight .mini { display: flex; gap: 0.4rem; }
.set-weight .step-btn { height: 2.75rem; width: 2.75rem; font-size: 1.5rem; }
.swap { font-size: 0.9rem; font-weight: 600; color: var(--warn); }
body[data-phase="work"] .swap { color: var(--fg); }
.warm-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.warm-list li { padding: 0.8rem 1rem; background: var(--panel); border-radius: 0.75rem; font-weight: 600; }

/* Touch lock */
.lock { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 1rem) max(16px, env(safe-area-inset-left, 0px)); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }

<script>
(() => {
  "use strict";
  const TEST = /^#test/.test(location.hash), T0 = Date.now();

  // =====================================================================
  // Plan
  // =====================================================================
  const PLAN_START = new Date(2026, 10, 16); // Monday 16 Nov 2026 = week 1
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const DAYS3 = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  // Interval sessions (Tuesday)
  const ZONES = {
    threshold: { name: "threshold", target: 257, band: "4:15–4:20" },
    race:      { name: "race pace", target: 245, band: "4:04–4:06" },
    intervals: { name: "interval pace", target: 237, band: "3:55–4:00" }
  };
  const INTERVALS = [
    { w: 1,  reps: 4, kind: "time", work: 360,  rest: 90,  zone: "threshold" },
    { w: 2,  reps: 3, kind: "time", work: 480,  rest: 120, zone: "threshold" },
    { w: 3,  reps: 6, kind: "dist", work: 800,  rest: 90,  zone: "intervals" },
    { w: 4,  reps: 2, kind: "time", work: 600,  rest: 180, zone: "threshold" },

    { w: 10, reps: 3, kind: "dist", work: 1000, rest: 120, zone: "race" }
  ];
  const WARMUP = 720, COOLDOWN = 480, STRIDES = [480, 540, 600, 660], STRIDE_LEN = 20;

  // Easy and long runs are set by distance. Segment types and how each is paced.
  const SEG = {
    easy:  { label: "Easy",               mode: "fast",   lo: 315,              pace: 330, desc: "easy, 5:15–5:45/km", phase: "idle" },
    steady:{ label: "Steady",             mode: "target", target: 285,          pace: 285, desc: "steady, 4:40–4:50/km", phase: "work" },
    build: { label: "Build to threshold", mode: "band",   lo: 255, hi: 290,     pace: 270, desc: "building from 4:45 to 4:20/km", phase: "work" },

    first: { label: "First km",           mode: "target", target: 247,          pace: 247, desc: "4:06–4:08/km, hold back", phase: "work" },
    hold:  { label: "Lock in",            mode: "target", target: 245,          pace: 245, desc: "4:04–4:05/km, run even", phase: "work" },

  const LONG = {
    1: { list: [["easy", 8500]], title: "8.5 km easy" },
    2: { list: [["easy", 6500], ["steady", 2000]], title: "8.5 km, last 2 km steady" },
    3: { list: [["easy", 6000], ["build", 3000]], title: "9 km, last 3 km building" },
    4: { list: [["easy", 7000]], title: "7 km easy" },
    5: { list: [["easy", 8500]], title: "8.5 km easy" },
    6: { list: [["easy", 3000], ["race", 2000], ["easy", 500], ["race", 2000], ["easy", 1500]], title: "9 km with 2 × 2 km race pace" },
    7: { list: [["easy", 6000], ["build", 3000]], title: "9 km, last 3 km building" },
    8: { list: [["easy", 3000], ["race", 1500], ["easy", 500], ["race", 1500], ["easy", 500], ["race", 1500], ["easy", 1000]], title: "9.5 km with 3 × 1.5 km race pace" },
    9: { list: [["easy", 8000]], title: "8 km easy, 6 strides", strides: { from: 6800, n: 6 } }
  };
  function mkCont(kind, w, title, list, strides, v) {
    let pos = 0;
    const segs = list.map(([key, dist]) => {
      const s = Object.assign({ key: key, dist: dist, start: pos, end: pos + dist }, SEG[key]);
      pos += dist;

    });
    return { kind: kind, w: w, v: v || null, title: title, segs: segs, total: pos, strides: strides ? Object.assign({ on: 20, off: 40 }, strides) : null };
  }
  function easyPlan(w, v) {
    const light = isLight(w) || w >= 10, dist = light ? 4000 : 5000;
    let strides = null;

    return mkCont("easy", w, dist / 1000 + " km easy" + (strides ? ", " + strides.n + " strides" : ""), [["easy", dist]], strides, v);
  }
  function longPlan(w) {
    if (w >= 10) return mkCont("race", 10, "Race: 10 km", [["first", 1000], ["hold", 6000], ["push", 3000]], null);
    const L = LONG[Math.max(1, w)];
    return mkCont("long", w, L.title, L.list, L.strides, null);
  }
  function intervalPlan(w) { return INTERVALS.find((p) => p.w === Math.min(10, Math.max(1, w))); }
  function fmtWork(p) { return p.kind === "time" ? p.work / 60 + " min" : p.work >= 1000 ? p.work / 1000 + " km" : p.work + " m"; }
  function iTitle(p) { return p.reps + " × " + fmtWork(p) + " " + ZONES[p.zone].name; }
  function contEst(plan) {
    let t = plan.segs.reduce((a, s) => a + s.dist / 1000 * s.pace, 0);

  }
  function iEst(p) {

  }

  // Strength

    "b-thrust":  { name: "Dumbbell hip thrust", say: "hip thrust", cue: "Shoulders on the bench, dumbbell on your hips", reps: 12, load: "single", legs: true, anim: "thrust" },

  // The week
  function weekSchedule(w) {
    const ww = Math.min(Math.max(1, w), 10);
    if (ww === 10) return [
      [{ t: "strength", s: "A", label: "Strength A, light" }, { t: "easy", v: "mon", label: easyPlan(10, "mon").title }],
      [{ t: "intervals", label: "Intervals: " + iTitle(intervalPlan(10)) }],
      [{ t: "note", label: "Rest. Skip padel this week" }],
      [{ t: "easy", v: "thu", label: easyPlan(10, "thu").title }],
      [{ t: "note", label: "Rest, or 15 min very easy" }],
      [{ t: "long", label: "Race day: 10 km" }],
      [{ t: "note", label: "Rest" }]

    return [
      [{ t: "strength", s: "A", label: "Strength A" }, { t: "easy", v: "mon", label: easyPlan(ww, "mon").title }],
      [{ t: "intervals", label: "Intervals: " + iTitle(intervalPlan(ww)) }],

      [{ t: "note", label: "Rest" }],
      [{ t: "long", label: "Long run: " + longPlan(ww).title }],
      [{ t: "note", label: "Rest, plus the desk reset" }]

  }

  // =====================================================================
  // Helpers
  // =====================================================================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function fmtDist(m) { return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km"; }
  function fmtKm(m) { return (Math.round(m / 100) / 10) + " km"; }
  function spokenDist(m) {
    if (m >= 950) { const k = Math.round(m / 100) / 10; return k + (k === 1 ? " kilometre" : " kilometres"); }
    return Math.max(10, Math.round(m / 10) * 10) + " metres";
  }
  const fmtKg = (kg) => String(Math.round(kg * 10) / 10);
  function parseKg(v) {
    const s = String(v == null ? "" : v).trim().replace(",", ".");
    if (s === "") return null;
    const n = parseFloat(s);
    if (!isFinite(n) || n < 0 || n > 150) return null;

  }
  function fmtDay(d) { try { return new Date(d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); } catch (e) { return ""; } }

  const dateOf = (w, di) => new Date(2026, 10, 16 + 7 * (w - 1) + di);
  const isLight = (w) => w === 4 || w === 9;
  const shortWeek = (w) => (w > 10 ? "After race" : "Week " + w);
  function geoDist(a, b) {

  }

  // =====================================================================

  // =====================================================================
  const RKEY = "sub41-intervals-v1", SKEY = "sub41-coach-v1";
  let RS = { tol: 5, history: [] };

    const raw = localStorage.getItem(RKEY);

  function isDone(item, w) {
    if (item.t === "strength") return S.sessions.some((x) => x.type === item.s && x.week === w);
    if (item.t === "easy") return RS.history.some((x) => runKind(x) === "easy" && x.w === w && x.v === item.v);
    if (item.t === "intervals") return RS.history.some((x) => runKind(x) === "intervals" && x.w === w);

  if (synth) { pickVoice(); try { synth.addEventListener("voiceschanged", pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; } }
  function speakNow(text) {

    const sk = $("setKg"); if (sk) sk.textContent = weightText(id);
    const er = $("kgErr"); if (er) er.textContent = "";
  }
  function copyText(text, b) {
    const fallback = () => { ui.copyText = text; render(); const box = $("copyBox"); if (box) { box.focus(); box.select(); } };
    try { navigator.clipboard.writeText(text).then(() => { b.textContent = "Copied"; }, fallback); } catch (err) { fallback(); }
  }
  app.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    unlockAudio();
    const act = b.getAttribute("data-act");
    switch (act) {
      case "home": if (!R) stopGps(); ui.view = "home"; ui.lastRun = null; ui.lastLift = null; ui.copyText = null; render(); app.scrollTop = 0; break;
      case "go-run": {
        ui.view = "runSetup"; ui.rKind = b.getAttribute("data-k") || null; ui.rVar = b.getAttribute("data-v") || null;
        ui.rWeek = b.getAttribute("data-w") ? +b.getAttribute("data-w") : null; ui.lastLift = null; ui.copyText = null;
        startGps(); render(); break;
      }
      case "go-lift": ui.view = "liftSetup"; ui.sType = b.getAttribute("data-s") || null; ui.preview = null; render(); break;
      // run setup
      case "rkind": ui.rKind = b.getAttribute("data-k"); render(); break;
      case "rvar": ui.rVar = b.getAttribute("data-v"); render(); break;
      case "tol": RS.tol = +b.getAttribute("data-tol"); saveRuns(); render(); break;
      case "gps": startGps(); break;
      case "test-voice-run": say("Kilometre 3. Split 5 21. Average 5 24.", true); beep(880, 0.15, 0.25); break;
      case "run-start": runStart(); break;
      case "run-pause": runPause(); break;
      case "run-skip": runSkip(); break;
      case "run-end": ui.confirmEnd = true; renderRun(); break;
      case "run-end-cancel": ui.confirmEnd = false; renderRun(); break;
      case "run-end-save": hush(); finishRun(Date.now(), false); break;
      case "run-end-discard": runDiscard(); break;
      case "lock": setLock(true); break;
      case "copy-run": copyText(runSummaryText(ui.lastRun), b); break;
      // strength
      case "stype": ui.sType = b.getAttribute("data-type"); ui.preview = null; render(); break;
      case "rest-opt": S.rest = +b.getAttribute("data-rest"); saveStrength(); render(); break;
      case "preview": { const id = b.getAttribute("data-id"); ui.preview = ui.preview === id ? null : id; render(); break; }
      case "test-voice-lift": say("One. Two. Three. Rest. Next: bench press. 18 kilos each hand."); beep(620, 0.05, 0.15); break;
      case "lift-start": sStart(); break;
      case "lift-resume": sResume(); break;
      case "lift-close": sFinish(false, ""); break;
      case "lift-discard": sDiscard(); break;
      case "warm-done": sLead(0, "ready", ""); break;
      case "lift-go": {
        if (needsWeight(C.k)) {
          const er = $("kgErr"); if (er) er.textContent = "Enter the weight you'll use, in kg." + (EX[SETS[C.k].ex].allowZero ? " Enter 0 for bodyweight." : "");
          const inp = $("kgInput"); if (inp) inp.focus();
          break;
        }
        sLead(C.k, "go", "");
        break;
      }
      case "skip-lead": sSkipLead(); break;
      case "add-rest": if (C && C.phase === "lead") { C.leadDur += 15; sFired = {}; saveStrength(); sPaintLead((Date.now() - C.t0) / 1000); } break;
      case "lift-pause": sPause(); break;
      case "stop-set": sStopSet(); break;
      case "minus": nudge(-STEP); break;
      case "plus": nudge(STEP); break;
      case "lift-end": ui.confirmEnd = true; render(); break;
      case "lift-end-cancel": ui.confirmEnd = false; render(); break;
      case "lift-end-save": hush(); sFinish(false, ""); break;
      case "copy-lift": copyText(liftSummaryText(ui.lastLift), b); break;
    }
  });
  app.addEventListener("change", (e) => {
    if (e.target.id === "rWeekSel") { const v = +e.target.value; ui.rWeek = v === Math.min(planWeek(), 10) ? null : v; render(); }
    if (e.target.id === "sWeekSel") { const v = +e.target.value; ui.sWeek = v === planWeek() ? null : v; ui.preview = null; render(); }
  });
  app.addEventListener("input", (e) => {
    if (e.target.id === "kgInput" && C && SETS[C.k]) {
      C.weights[SETS[C.k].ex] = parseKg(e.target.value); saveStrength();
      const er = $("kgErr"); if (er) er.textContent = "";
    }
  });
  app.addEventListener("keydown", (e) => { if (e.target.id === "kgInput" && e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
  document.addEventListener("pointerdown", unlockAudio, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
    const gap = hiddenAt ? Date.now() - hiddenAt : 0;
    hiddenAt = 0;
    if (R && !R.done && ui.view === "run") {
      requestWake(); runTick();
      if (R && !R.done && gap > 3000) { R.note = "The screen was off for " + fmtClock(gap) + ", so cues and GPS paused. Keep the screen on."; R.noteUntil = Date.now() + 60000; paintRun(Date.now()); }
    }
    if (C && ui.view === "lift") { requestWake(); sTick(); }
  });
  window.addEventListener("hashchange", render);

  render();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
