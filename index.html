<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intervals">
<meta name="theme-color" content="#F2F4F1">
<title>Sub-41 Intervals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen running tool. Plan on the start screen; on the run, one phase fills the screen in a colour you can read at a glance: blue = interval, sage = rest, neutral = warm-up and warm-down. */
:root {
  --ink: #1A1D2E;
  --ink-soft: #4F566B;
  --line: #CBD0DA;
  --surface: #F2F4F1;
  --card: #FFFFFF;
  --accent: #2340F0;
  --on-accent: #FFFFFF;
  --work: #2340F0;
  --on-work: #FFFFFF;
  --on-work-soft: rgba(255, 255, 255, 0.84);
  --work-card: rgba(255, 255, 255, 0.14);
  --rest: #D8E4DE;
  --rest-card: #EDF3EF;
  --on-rest: #1A1D2E;
  --on-rest-soft: #46524D;
  --fast: #FFC94A;
  --slow: #FF9B8A;
  --ok: #FFFFFF;
  --chip-ink: #1A1D2E;
  --warn: #9A4A12;
  --good: #1E7A4C;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E8EBF2;
    --ink-soft: #A2A9BD;
    --line: #2F3447;
    --surface: #141724;
    --card: #1D2132;
    --accent: #3D58F6;
    --work: #2038D8;
    --rest: #17251F;
    --rest-card: #1F3129;
    --on-rest: #E3EDE8;
    --on-rest-soft: #9FB3AA;
    --warn: #F2A46B;
    --good: #6FD39C;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  --bg: var(--surface);
  --fg: var(--ink);
  --fg-soft: var(--ink-soft);
  --panel: var(--card);
  height: 100%;
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.3s ease, color 0.3s ease;
}
body[data-phase="work"] { --bg: var(--work); --fg: var(--on-work); --fg-soft: var(--on-work-soft); --panel: var(--work-card); }
body[data-phase="rest"],
body[data-phase="done"] { --bg: var(--rest); --fg: var(--on-rest); --fg-soft: var(--on-rest-soft); --panel: var(--rest-card); }

#app {
  height: 100%;
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
p { margin: 0; }
h1, h2, h3 { margin: 0; }
.soft { color: var(--fg-soft); }

/* Controls */
button, select { font: inherit; color: inherit; }
.btn {
  appearance: none;
  font-weight: 700;
  font-size: 1.05rem;
  min-height: 3.25rem;
  padding: 0 1rem;
  border-radius: 0.875rem;
  border: 2px solid var(--fg);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
body[data-phase="work"] .btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.big { width: 100%; min-height: 4rem; font-size: 1.25rem; }
.btn.small { min-height: 2.75rem; font-size: 0.95rem; padding: 0 0.9rem; white-space: nowrap; }
.btn:disabled { opacity: 0.4; }
.btn:active { transform: translateY(1px); }
.link-btn {
  appearance: none;
  background: none;
  border: 0;
  padding: 0.5rem 0.25rem;
  min-height: 2.75rem;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 0.2em;
  cursor: pointer;
  touch-action: manipulation;
}
.btn:focus-visible, .link-btn:focus-visible, .seg button:focus-visible, select:focus-visible, .unlock:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
body[data-phase="work"] .btn:focus-visible { outline-color: var(--fg); }

.label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-soft); }
.seg { display: flex; border: 2px solid var(--fg); border-radius: 0.75rem; overflow: hidden; }
.seg button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  min-height: 2.75rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  font-variant-numeric: tabular-nums;
}
.seg button + button { border-left: 2px solid var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.select-wrap { position: relative; }
.select-wrap::after {
  content: "";
  position: absolute;
  right: 0.9rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--fg);
  border-bottom: 2px solid var(--fg);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  font-weight: 700;
  font-size: 1rem;
  min-height: 3rem;
  padding: 0 2.25rem 0 0.85rem;
  border: 2px solid var(--fg);
  border-radius: 0.75rem;
  background: transparent;
}

/* Start */
.start { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 1.4rem; padding-top: 1.25rem; }
.eyebrow { margin-bottom: 0.35rem; }
.title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 4.5rem;
  font-size: clamp(4rem, 21vw, 6.5rem);
  line-height: 0.82;
  letter-spacing: -0.01em;
}
.field { display: flex; flex-direction: column; gap: 0.4rem; }
.session { display: flex; flex-direction: column; gap: 0.8rem; }
.session-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.75rem;
  line-height: 0.9;
}
.session-sub { color: var(--fg-soft); }
.steps { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--fg); }
.steps li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.75rem;
  align-items: baseline;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--line);
}
.steps .what { font-weight: 600; min-width: 0; }
.steps .what span { display: block; font-weight: 400; font-size: 0.92rem; color: var(--fg-soft); }
.steps .how { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.total { font-weight: 600; color: var(--fg-soft); }
.panel { background: var(--panel); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.panel-row > div { min-width: 0; }
.status { font-weight: 700; }
.status-note { font-size: 0.9rem; color: var(--fg-soft); }
.dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.4rem; background: var(--fg-soft); vertical-align: 0.05em; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.history h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; margin-bottom: 0.4rem; }
.history details { border-top: 1px solid var(--line); }
.history details:last-of-type { border-bottom: 1px solid var(--line); }
.history summary {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 0;
  min-height: 2.75rem;
  cursor: pointer;
  list-style: none;
  font-weight: 600;
}
.history summary::-webkit-details-marker { display: none; }
.history summary .soft { font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.history ul { list-style: none; margin: 0 0 0.75rem; padding: 0; font-size: 0.92rem; }
.history li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.15rem 0; font-variant-numeric: tabular-nums; }
.history li span:first-child { color: var(--fg-soft); }
.history li span:last-child { font-weight: 600; white-space: nowrap; }
.fine { font-size: 0.85rem; color: var(--fg-soft); }
.sticky-bar { position: sticky; bottom: 0; margin-top: auto; padding: 0.75rem 0 1rem; background: var(--bg); }

/* Run */
.run { padding-top: 0.5rem; gap: 0.5rem; }
.run-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-weight: 700; }
.run-top .soft { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.segs { display: flex; gap: 2px; align-items: center; height: 0.9rem; }
.segs span { height: 0.45rem; border-radius: 1px; background: var(--fg); opacity: 0.22; min-width: 2px; }
.segs span.w { height: 0.65rem; }
.segs span.done { opacity: 0.65; }
.segs span.now { opacity: 1; height: 0.9rem; }
.banner { background: var(--panel); border-radius: 0.75rem; padding: 0.6rem 0.8rem; font-size: 0.92rem; font-weight: 600; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 0.6rem; }
.phase-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.6rem;
  font-size: clamp(2.3rem, 11vw, 3.4rem);
  line-height: 0.92;
}
.phase-sub { font-weight: 600; color: var(--fg-soft); }
.count {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  margin: 0.2rem 0 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 7rem;
  font-size: clamp(6rem, 33vw, 10rem);
  line-height: 0.8;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.count small { font-family: var(--font-ui); font-size: 1.1rem; font-weight: 700; letter-spacing: 0; }
body.is-paused .count { opacity: 0.35; }
.bar { height: 0.6rem; border-radius: 0.3rem; background: rgba(127, 127, 127, 0.28); overflow: hidden; }
.bar > div { height: 100%; background: var(--fg); transform-origin: left center; transform: scaleX(0); }
.detail { font-weight: 600; font-variant-numeric: tabular-nums; }
.pace-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.pace-box { background: var(--panel); border-radius: 0.875rem; padding: 0.7rem 0.85rem; display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.pace-val { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pace-val small { font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600; }
.pace-val.window { font-size: 1.75rem; white-space: nowrap; line-height: 1.15; }
body.locked .controls, body.locked .gps-line { visibility: hidden; }
.call {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  border-radius: 0.875rem;
  padding: 0.7rem 0.9rem;
  background: var(--ok);
  color: var(--chip-ink);
  font-weight: 700;
}
.call.fast { background: var(--fast); }
.call.slow { background: var(--slow); }
.call .call-word { font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; }
.call .call-meta { font-variant-numeric: tabular-nums; white-space: nowrap; }
.next { font-weight: 600; }
.next span { font-weight: 400; color: var(--fg-soft); }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; padding: 0.25rem 0 0.5rem; }
.gps-line { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; font-weight: 600; color: var(--fg-soft); padding-bottom: 0.75rem; font-variant-numeric: tabular-nums; }
.confirm { background: var(--panel); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 0.75rem; }
.confirm .q { font-weight: 700; font-size: 1.1rem; }
.confirm .link-btn { align-self: center; }

/* Touch lock */
.lock {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 1rem) max(16px, env(safe-area-inset-left, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}
.unlock {
  position: relative;
  overflow: hidden;
  appearance: none;
  width: 100%;
  max-width: 34rem;
  min-height: 3.5rem;
  border-radius: 999px;
  border: 2px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.unlock-fill { position: absolute; inset: 0; background: var(--fg); opacity: 0.25; transform: scaleX(0); transform-origin: left center; }
.unlock.holding .unlock-fill { transform: scaleX(1); transition: transform 0.8s linear; }
.unlock-text { position: relative; }

/* Done */
.done { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 1.1rem; padding-top: 1.75rem; }
.done-title { font-family: var(--font-display); font-weight: 900; font-size: 6rem; font-size: clamp(5rem, 28vw, 9rem); line-height: 0.8; }
.done-meta { font-weight: 600; font-size: 1.1rem; }
.reps { list-style: none; margin: 0; padding: 0; }
.reps li { padding: 0.65rem 0; border-top: 1px solid rgba(127, 127, 127, 0.35); display: flex; flex-direction: column; gap: 0.15rem; }
.rep-main { display: flex; justify-content: space-between; gap: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.rep-main span:first-child { min-width: 0; }
.rep-main span:last-child { white-space: nowrap; }
.rep-splits { font-size: 0.9rem; color: var(--fg-soft); font-variant-numeric: tabular-nums; }
.done-actions { display: grid; gap: 0.6rem; }
.copy-box { width: 100%; min-height: 8rem; font: 0.85rem/1.4 ui-monospace, Menlo, monospace; border-radius: 0.75rem; border: 1px solid var(--line); padding: 0.6rem; background: var(--panel); color: var(--fg); }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) {
  body, .unlock.holding .unlock-fill { transition: none; }
}
</style>
</head>
<body data-phase="idle">
<main id="app"></main>
<div id="lock" class="lock" hidden>
  <button type="button" id="unlockBtn" class="unlock"><span class="unlock-fill"></span><span class="unlock-text">Locked. Hold to unlock</span></button>
</div>
<p id="live" class="sr-only" aria-live="polite"></p>

<script>
(() => {
  "use strict";

  // ---------- Plan ----------
  const PLAN_START = new Date(2026, 10, 16); // Mon 16 Nov 2026 = week 1
  const ZONES = {
    threshold: { name: "threshold", target: 257, band: "4:15–4:20" },
    race:      { name: "race pace", target: 245, band: "4:04–4:06" },
    intervals: { name: "interval pace", target: 237, band: "3:55–4:00" }
  };
  const PLAN = [
    { w: 1,  reps: 4, kind: "time", work: 360,  rest: 90,  zone: "threshold" },
    { w: 2,  reps: 3, kind: "time", work: 480,  rest: 120, zone: "threshold" },
    { w: 3,  reps: 6, kind: "dist", work: 800,  rest: 90,  zone: "intervals" },
    { w: 4,  reps: 2, kind: "time", work: 600,  rest: 180, zone: "threshold" },
    { w: 5,  reps: 5, kind: "dist", work: 1000, rest: 90,  zone: "intervals" },
    { w: 6,  reps: 3, kind: "dist", work: 2000, rest: 120, zone: "race" },
    { w: 7,  reps: 6, kind: "dist", work: 1000, rest: 75,  zone: "intervals" },
    { w: 8,  reps: 2, kind: "dist", work: 3000, rest: 180, zone: "race" },
    { w: 9,  reps: 6, kind: "dist", work: 800,  rest: 60,  zone: "intervals" },
    { w: 10, reps: 3, kind: "dist", work: 1000, rest: 120, zone: "race" }
  ];
  const WARMUP = 720, COOLDOWN = 480, STRIDES = [480, 540, 600, 660], STRIDE_LEN = 20;
  const SPLIT = 250, MAX_ACC = 30, KEY = "sub41-intervals-v1";
  const PHRASE = { fast: "Slow down", slow: "Speed up", on: "On pace" };

  // Hidden test mode: #sim or #sim=20 runs a sped-up simulated run with fake GPS
  const SIM = (() => { const m = location.hash.match(/^#sim(?:=(\d+))?$/); return m ? (+m[1] || 20) : 0; })();
  const simBase = Date.now();
  const now = () => SIM ? simBase + (Date.now() - simBase) * SIM : Date.now();

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => (n < 10 ? "0" : "") + n;
  function fmtPace(s) {
    if (s == null || !isFinite(s) || s <= 0 || s > 1200) return "–";
    const r = Math.round(s), m = Math.floor(r / 60);
    return m + ":" + pad(r % 60);
  }
  function spokenPace(s) {
    const r = Math.round(s), m = Math.floor(r / 60), sec = r % 60;
    return m + " " + (sec < 10 ? "oh " + sec : sec);
  }
  function fmtClock(ms) {
    const t = Math.max(0, Math.round(ms / 1000)), m = Math.floor(t / 60);
    return m + ":" + pad(t % 60);
  }
  function fmtDist(m) {
    if (m < 1000) return Math.round(m) + " m";
    return (m / 1000).toFixed(2) + " km";
  }
  function fmtWork(p) { return p.kind === "time" ? p.work / 60 + " min" : p.work >= 1000 ? p.work / 1000 + " km" : p.work + " m"; }
  function fmtRest(s) { return s >= 120 && s % 60 === 0 ? s / 60 + " min" : s + " s"; }
  function title(p) { return p.reps + " × " + fmtWork(p); }
  function tuesday(w) { return new Date(2026, 10, 17 + 7 * (w - 1)); }
  function fmtDay(d) {
    try { return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); } catch (e) { return ""; }
  }
  function currentWeek() {
    const t = new Date(), d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const days = Math.round((d - PLAN_START) / 864e5);
    return Math.min(10, Math.max(1, Math.floor(days / 7) + 1));
  }
  function estSeconds(p) {
    const work = p.kind === "time" ? p.work : p.work / 1000 * ZONES[p.zone].target;
    return WARMUP + p.reps * work + (p.reps - 1) * p.rest + COOLDOWN;
  }
  function geoDist(a, b) {
    const R = 6371000, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  // ---------- Storage ----------
  let store = { tol: 5, history: [] };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if ([3, 5, 8].includes(d.tol)) store.tol = d.tol;
      if (Array.isArray(d.history)) store.history = d.history.slice(-30);
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  // ---------- Voice and beeps ----------
  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  let voice = null;
  function pickVoice() {
    if (!synth) return;
    try {
      const vs = synth.getVoices() || [];
      const gb = vs.filter((v) => /^en[-_]GB/i.test(v.lang));
      const en = vs.filter((v) => /^en([-_]|$)/i.test(v.lang));
      voice = gb.find((v) => /Daniel|Arthur|Serena|Kate|Martha|Google UK/i.test(v.name)) || gb.find((v) => v.localService) || gb[0] || en[0] || null;
    } catch (e) { voice = null; }
  }
  if (synth) {
    pickVoice();
    try { synth.addEventListener("voiceschanged", pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; }
  }
  function speakNow(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-GB"; }
      u.rate = 1.0;
      u.volume = 1;
      synth.speak(u);
    } catch (e) {}
  }
  function say(text, flush) {
    if (SIM) console.log("[cue] " + Math.round((now() - (R ? R.startedAt : now())) / 1000) + "s " + text);
    const live = $("live"); if (live) live.textContent = text;
    if (!synth) return;
    try {
      if (flush && (synth.speaking || synth.pending)) {
        synth.cancel();
        setTimeout(() => speakNow(text), 60);

        speakNow(text);

  // ---------- Screen wake lock ----------
  let wake = null, wakeFailed = false;

      if (wake) return;
      navigator.wakeLock.request("screen").then((w) => {
        wake = w; wakeFailed = false;
        w.addEventListener("release", () => { wake = null; });
      }).catch(() => { wake = null; wakeFailed = true; if (ui.view === "run") paint(now()); });
    } catch (e) { wakeFailed = true; }
  }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }

  // ---------- GPS ----------
  const gps = { state: "off", watch: null, last: null, goodAt: 0, acc: null, trail: [], skips: 0 };
  function gpsHealthy(t) { return gps.goodAt > 0 && t - gps.goodAt < 15000; }

    if (gps.watch != null) return;

    if (!window.isSecureContext) { gps.state = "insecure"; refreshGps(); return; }
    if (!("geolocation" in navigator)) { gps.state = "unsupported"; refreshGps(); return; }

    } catch (e) { gps.state = "unsupported"; }

  function stopGps() {

  function onFix(p) {

    if (!(c.accuracy <= MAX_ACC)) { gps.state = "weak"; refreshGps(); return; }
    gps.state = "good"; gps.goodAt = t;

    const pt = { lat: c.latitude, lon: c.longitude, t: t }, prev = gps.last;
    if (!prev) { gps.last = pt; return; }
    const dt = (t - prev.t) / 1000;
    if (dt < 0.5) return;
    const d = geoDist(prev, pt);
    if (d / dt > 8) { if (++gps.skips >= 3) { gps.last = pt; gps.skips = 0; } return; }
    gps.skips = 0;
    gps.last = pt;
    if (!R || R.done || R.paused) return;

  }
  function gpsSummary() {
    switch (gps.state) {
      case "good": return { cls: "good", text: "GPS ready", note: "Accurate to about " + Math.round(gps.acc) + " m." };
      case "weak": return { cls: "warn", text: "GPS signal weak", note: "Accuracy is " + (gps.acc ? Math.round(gps.acc) + " m" : "poor") + ". Open sky helps; it usually settles during the warm-up." };
      case "checking":
      case "searching": return { cls: "", text: "Finding GPS…", note: "Stand outside with a clear view of the sky." };
      case "denied": return { cls: "warn", text: "Location is off for this page", note: "Turn it on in Settings > Privacy & Security > Location Services > Safari Websites: While Using, with Precise Location on. Then reload this page." };
      case "insecure": return { cls: "warn", text: "GPS needs your https link", note: "Open the page from its github.io address, not as a saved file." };
      case "unsupported": return { cls: "warn", text: "No GPS in this browser", note: "Open the page in Safari." };
      default: return { cls: "", text: "GPS not started", note: "Check it before you set off. The warm-up gives it time to settle." };
    }
  }
  function refreshGps() {
    if (ui.view === "start") {
      const s = gpsSummary(), a = $("gpsStatus"), b = $("gpsNote");
      if (a) a.innerHTML = '<span class="dot ' + s.cls + '"></span>' + esc(s.text);
      if (b) b.textContent = s.note;
      const btn = $("gpsBtn"); if (btn) btn.hidden = gps.state !== "off" && gps.state !== "denied";
    }
  }

  // Simulated GPS for test mode
  let simPace = 330;
  function startSimGps() {
    gps.state = "checking";
    let lat = 51.515, lon = -0.09, lastT = now(), drift = 0, simSegAt = 0;
    gps.watch = setInterval(() => {
      const t = now();
      while (t - lastT >= 1000) {
        lastT += 1000;
        let pace = 330;
        if (R && !R.done && R.phases[R.i].type === "work") {
          if (lastT - simSegAt > 55000) { simSegAt = lastT; simPace = ZONES[R.plan.zone].target + (Math.random() * 22 - 11); }
          pace = simPace;
        }
        if (!(R && R.paused)) lat += (1000 / pace) / 111320;
        drift = Math.max(-3, Math.min(3, drift + (Math.random() - 0.5) * 0.6));
        onFix({ coords: { latitude: lat + drift / 111320, longitude: lon, accuracy: 6 }, timestamp: lastT });
      }
    }, 50);
  }

  // ---------- Run engine ----------
  let R = null, ticker = null, hiddenAt = 0;
  const ui = { view: "start", week: null, confirmEnd: false, locked: false, lastRun: null, copyText: null };

  function planFor(w) { return PLAN.find((p) => p.w === w) || PLAN[0]; }
  function buildPhases(p) {
    const a = [{ type: "warmup", dur: WARMUP }];
    for (let n = 1; n <= p.reps; n++) {
      if (p.kind === "time") a.push({ type: "work", n: n, kind: "time", dur: p.work });
      else a.push({ type: "work", n: n, kind: "dist", dist: p.work, est: p.work / 1000 * ZONES[p.zone].target });
      if (n < p.reps) a.push({ type: "rest", n: n, dur: p.rest });
    }
    a.push({ type: "cool", dur: COOLDOWN });
    return a;
  }
  function phaseSecs(ph) { return ph.dur != null ? ph.dur : ph.est; }

  function startRun() {
    unlockAudio();
    const w = ui.week || currentWeek(), p = planFor(w), t = now();
    R = { plan: p, w: w, phases: buildPhases(p), i: 0, phaseStart: t, startedAt: t, paused: false, pauseAt: 0,
          fired: {}, reps: [], cur: null, totalDist: 0, done: false, lastCall: null, note: null };
    gps.trail = [];
    startGps();
    say("Start workout. Warm up.", true);
    beep(1320, 0.3, 0.3);
    requestWake();
    ui.view = "run"; ui.confirmEnd = false;
    setLock(true);
    clearInterval(ticker);
    ticker = setInterval(tick, SIM ? 50 : 250);
    render();
  }

  function tick() {
    if (!R || R.done) return;
    const t = now();
    if (!R.paused) {
      for (let g = 0; g < 80 && !R.done; g++) {
        const ph = R.phases[R.i], el = t - R.phaseStart;
        if (ph.dur != null) {
          if (el >= ph.dur * 1000) { finishPhase(R.phaseStart + ph.dur * 1000); continue; }
        } else {
          // Distance reps end on GPS distance; without a GPS signal they fall back to the target time
          const fb = ph.est * 1000, endAt = gpsHealthy(t) ? 2 * fb : fb;

        }

      }
      if (!R.done) cues(t);
    }
    if (!R.done) paint(t);
  }

  function cues(t) {
    const ph = R.phases[R.i], el = (t - R.phaseStart) / 1000, nx = R.phases[R.i + 1];
    const at = (key, sec, fn) => {
      if (el >= sec && !R.fired[key]) { R.fired[key] = true; if (el - sec < 4) fn(); }
    };
    if (ph.type === "warmup") {
      STRIDES.forEach((s, k) => {
        at("s" + k, s, () => { say("Stride " + (k + 1) + " of 4. Go.", true); beep(1320, 0.2, 0.25); });
        at("e" + k, s + STRIDE_LEN, () => { say("Ease off.", true); });
      });
    }

  function transitionText(ph, nx) {
    if (ph.type === "warmup") return "End warm-up. Start interval " + nx.n + ".";
    if (ph.type === "work" && nx.type === "rest") return "End interval " + ph.n + ". Start rest " + nx.n + ".";
    if (ph.type === "rest") return "Start interval " + nx.n + ".";

  }

  function finishPhase(endT) {
    const ph = R.phases[R.i];

  // ---------- Touch lock ----------

  const app = $("app");

  }

  function renderStart() {
    document.body.setAttribute("data-phase", "idle");
    const auto = currentWeek(), w = ui.week || auto, p = planFor(w), z = ZONES[p.zone], tol = store.tol;
    const before = new Date() < PLAN_START;
    const opts = PLAN.map((q) => {
      const tag = q.w === auto ? (before ? " (next)" : " (this week)") : "";
      return '<option value="' + q.w + '"' + (q.w === w ? " selected" : "") + ">Week " + q.w + " · " + esc(fmtDay(tuesday(q.w))) + tag + "</option>";
    }).join("");
    const repHow = p.kind === "time" ? "at " + fmtPace(z.target) + "/km" : fmtPace(z.target) + "/km";
    const s = gpsSummary();
    let h = '<section class="view start" aria-labelledby="startTitle">';
    h += '<header><p class="label eyebrow">Sub-41 plan · Tuesday quality run</p><h1 class="title" id="startTitle">Intervals</h1></header>';
    h += '<div class="field"><label class="label" for="weekSel">Plan week</label><div class="select-wrap"><select id="weekSel">' + opts + "</select></div></div>";
    h += '<div class="session"><h2 class="session-name">' + esc(title(p)) + "</h2>" +
      '<p class="session-sub">At ' + esc(z.name) + " (" + z.band + "/km), " + esc(fmtRest(p.rest)) + " jog between. Pace call every 250 m: on pace means " +
      fmtPace(z.target - tol) + "–" + fmtPace(z.target + tol) + "/km.</p>";
    h += '<ol class="steps">' +
      '<li><span class="what">Warm-up<span>Easy, with 4 × 20 s strides from 8 min</span></span><span class="how">12 min</span></li>' +
      '<li><span class="what">' + p.reps + " intervals of " + esc(fmtWork(p)) + "<span>" +
        (p.kind === "dist" ? "Each ends on GPS distance" : "Each ends on time") + "</span></span><span class=\"how\">" + repHow + "</span></li>" +
      '<li><span class="what">Rest<span>Jog between intervals</span></span><span class="how">' + esc(fmtRest(p.rest)) + "</span></li>" +
      '<li><span class="what">Warm-down<span>Easy</span></span><span class="how">8 min</span></li></ol>';
    h += '<p class="total">About ' + Math.round(estSeconds(p) / 60) + " minutes in total.</p></div>";

    h += '<div class="panel"><div class="panel-row"><div><p class="status" id="gpsStatus"><span class="dot ' + s.cls + '"></span>' + esc(s.text) +
      '</p><p class="status-note" id="gpsNote">' + esc(s.note) + '</p></div><button type="button" class="btn small" id="gpsBtn" data-act="gps"' +
      (gps.state !== "off" && gps.state !== "denied" ? " hidden" : "") + ">Check GPS</button></div></div>";
    h += '<div class="panel"><div class="panel-row"><div><p class="status">Voice cues</p><p class="status-note">Plays through your headphones or the phone speaker. Test the volume before you go.</p></div>' +
      '<button type="button" class="btn small" data-act="test-voice">Test voice</button></div></div>';
    h += '<div class="field"><span class="label" id="tolLbl">On-pace window</span><div class="seg" role="group" aria-labelledby="tolLbl">' +
      [3, 5, 8].map((v) => '<button type="button" data-act="tol" data-tol="' + v + '" aria-pressed="' + (tol === v) + '">±' + v + " s/km</button>").join("") + "</div></div>";
    h += historyHtml();
    h += '<p class="fine">Keep this page open with the screen on for the whole run. If the screen locks, the timer, voice and GPS stop.</p>';
    h += '<div class="sticky-bar"><button type="button" class="btn primary big" data-act="start">Start week ' + w + "</button></div></section>";
    app.innerHTML = h;
  }

  function avgPace(reps) {
    let t = 0, d = 0;
    reps.forEach((r) => { if (r.dist >= 50) { t += r.time; d += r.dist; } });
    return d ? t / (d / 1000) : null;
  }
  function historyHtml() {
    const hs = store.history.slice().reverse().slice(0, 8);
    let h = '<section class="history" aria-labelledby="histTitle"><h2 id="histTitle">Recent runs</h2>';
    if (!hs.length) return h + '<p class="soft">Your interval sessions show up here, with each rep\'s pace.</p></section>';
    hs.forEach((r) => {
      h += "<details><summary><span>" + esc(fmtDay(new Date(r.date))) + " · " + esc(r.title) + '</span><span class="soft">' +
        (avgPace(r.reps) ? fmtPace(avgPace(r.reps)) + "/km" : "–") + "</span></summary><ul>";
      r.reps.forEach((x) => {
        h += "<li><span>Interval " + x.n + "</span><span>" + esc(fmtDist(x.dist)) + " · " + fmtClock(x.time * 1000) + " · " + fmtPace(x.pace) + "/km</span></li>";
      });
      h += "</ul></details>";
    });
    return h + "</section>";
  }

  function phaseTitle(ph) {
    if (ph.type === "warmup") return "Warm-up";
    if (ph.type === "cool") return "Warm-down";
    if (ph.type === "rest") return "Rest " + ph.n;

  }
  function nextText(i) {
    const nx = R.phases[i + 1], z = ZONES[R.plan.zone];
    if (!nx) return "Then you're done.";
    if (nx.type === "work") return "Next: interval " + nx.n + " <span>· " + esc(fmtWork(R.plan)) + " at " + fmtPace(z.target) + "/km</span>";
    if (nx.type === "rest") return "Then rest " + nx.n + " <span>· " + esc(fmtRest(nx.dur)) + " jog</span>";
    return "Then warm-down <span>· 8 min easy</span>";
  }

  function renderRun() {
    const ph = R.phases[R.i], z = ZONES[R.plan.zone], tol = store.tol;
    document.body.setAttribute("data-phase", ph.type === "work" ? "work" : ph.type === "rest" ? "rest" : "idle");
    document.body.classList.toggle("is-paused", R.paused);
    const total = R.phases.reduce((a, p) => a + phaseSecs(p), 0);
    const segs = R.phases.map((p, k) => '<span class="' + (p.type === "work" ? "w " : "") + (k < R.i ? "done" : k === R.i ? "now" : "") +
      '" style="flex:' + (phaseSecs(p) / total).toFixed(4) + '"></span>').join("");
    let h = '<section class="view run" aria-label="Interval run">';
    h += '<header class="run-top"><span>Week ' + R.w + " · " + esc(title(R.plan)) + '</span><span class="soft" id="totalClock"></span></header>';
    h += '<div class="segs" aria-hidden="true">' + segs + "</div>";
    h += '<p class="banner" id="banner" hidden></p>';
    h += '<div class="stage"><h1 class="phase-name">' + esc(phaseTitle(ph)) + "</h1>";
    h += '<p class="phase-sub" id="phaseSub"></p>';
    h += '<div class="count" id="big" aria-hidden="true"></div>';
    h += '<div class="bar" aria-hidden="true"><div id="barFill"></div></div>';
    h += '<p class="detail" id="detail"></p>';
    if (ph.type === "work") {
      h += '<div class="pace-row"><div class="pace-box"><span class="label">Live pace</span><span class="pace-val" id="livePace">–</span></div>' +
        '<div class="pace-box"><span class="label">On pace</span><span class="pace-val window">' + fmtPace(z.target - tol) + "–" + fmtPace(z.target + tol) + "</span></div></div>";
      h += '<div class="call" id="call" hidden><span class="call-word" id="callWord"></span><span class="call-meta" id="callMeta"></span></div>';
    } else {
      h += '<div class="pace-row"><div class="pace-box"><span class="label">Live pace</span><span class="pace-val" id="livePace">–</span></div>' +
        '<div class="pace-box"><span class="label">Distance</span><span class="pace-val" id="totDist">0 m</span></div></div>';
    }
    h += '<p class="next">' + nextText(R.i) + "</p></div>";
    if (ui.confirmEnd) {
      h += '<div class="confirm"><p class="q">End this workout?</p>' +
        (R.reps.length || R.cur ? '<button type="button" class="btn primary" data-act="end-save">Save and finish</button>' : "") +
        '<button type="button" class="btn" data-act="end-discard">Discard</button>' +
        '<button type="button" class="link-btn" data-act="end-cancel">Keep going</button></div>';
    } else {
      h += '<div class="controls"><button type="button" class="btn" data-act="pause">' + (R.paused ? "Resume" : "Pause") + "</button>" +
        '<button type="button" class="btn" data-act="skip"' + (R.paused ? " disabled" : "") + ">Skip</button>" +
        '<button type="button" class="btn" data-act="end">End</button></div>';
      h += '<div class="gps-line"><span id="gpsLine"></span><button type="button" class="link-btn" data-act="lock" style="padding:0;min-height:0">Lock screen</button></div>';
    }
    h += "</section>";
    app.innerHTML = h;
    paint(now());
  }

  function paint(t) {
    if (!R || R.done || ui.view !== "run") return;
    const ph = R.phases[R.i], el = (R.paused ? R.pauseAt : t) - R.phaseStart;
    const tc = $("totalClock"); if (tc) tc.textContent = fmtClock((R.paused ? R.pauseAt : t) - R.startedAt);
    const big = $("big"), sub = $("phaseSub"), det = $("detail"), fill = $("barFill");
    let bigHtml = "", subText = "", detText = "", frac = 0;
    if (ph.type === "work" && ph.kind === "dist") {
      const rep = R.cur, left = Math.max(0, ph.dist - (rep ? rep.dist : 0));
      bigHtml = Math.round(left) + "<small>m to go</small>";
      frac = rep ? rep.dist / ph.dist : 0;
      subText = fmtWork(R.plan) + " at " + fmtPace(ZONES[R.plan.zone].target) + "/km";
      detText = fmtClock(el) + " elapsed · target " + fmtClock(ph.est * 1000);
      if (!gpsHealthy(t)) detText = "No GPS: this rep ends at " + fmtClock(ph.est * 1000);
    } else {
      const left = ph.dur * 1000 - el;
      bigHtml = fmtClock(left);
      frac = el / (ph.dur * 1000);
      if (ph.type === "work") {
        subText = fmtWork(R.plan) + " at " + fmtPace(ZONES[R.plan.zone].target) + "/km";
        detText = R.cur ? fmtDist(R.cur.dist) + " so far" : "";
      } else if (ph.type === "warmup") {
        const s = el / 1000;
        const k = STRIDES.findIndex((x) => s < x + STRIDE_LEN);
        if (k === -1) subText = "Easy. Interval 1 is next.";
        else if (s >= STRIDES[k]) subText = "Stride " + (k + 1) + " of 4: ease off in " + Math.ceil(STRIDES[k] + STRIDE_LEN - s) + " s";
        else subText = (k === 0 ? "Easy running. Strides start in " : "Easy. Stride " + (k + 1) + " in ") + fmtClock((STRIDES[k] - s) * 1000);
      } else if (ph.type === "rest") {
        subText = "Jog easy";
        const last = R.reps[R.reps.length - 1];
        if (last) detText = "Interval " + last.n + ": " + fmtDist(last.dist) + " in " + fmtClock(last.time * 1000) + (last.pace ? ", " + fmtPace(last.pace) + "/km" : "");
      } else {
        subText = "Easy jog to finish";
      }
    }
    if (R.paused) subText = "Paused";
    if (big && big.innerHTML !== bigHtml) big.innerHTML = bigHtml;
    if (sub && sub.textContent !== subText) sub.textContent = subText;
    if (det && det.textContent !== detText) det.textContent = detText;
    if (fill) fill.style.transform = "scaleX(" + Math.min(1, Math.max(0, frac)).toFixed(4) + ")";
    const lp = $("livePace"); if (lp) { const v = livePace(); lp.innerHTML = v ? fmtPace(v) + "<small> /km</small>" : "–"; }
    const td = $("totDist"); if (td) td.textContent = fmtDist(R.totalDist);
    const call = $("call");
    if (call && R.lastCall) {
      call.hidden = false;
      call.className = "call " + R.lastCall.v;
      $("callWord").textContent = PHRASE[R.lastCall.v];
      $("callMeta").textContent = fmtPace(R.lastCall.pace) + "/km at " + R.lastCall.m + " m";
    }
    const gl = $("gpsLine");
    if (gl) gl.textContent = gps.state === "good" ? "GPS ±" + Math.round(gps.acc) + " m" : gpsSummary().text;
    const bn = $("banner");
    if (bn) {
      const msg = (R.note && t < R.noteUntil ? R.note : "") || (wakeFailed ? "Your screen may lock on its own. Set Auto-Lock to Never in Settings > Display & Brightness." : "");
      bn.hidden = !msg; if (bn.textContent !== msg) bn.textContent = msg;
    }
  }

  function renderDone() {
    const r = ui.lastRun, z = ZONES[r.zone], ap = avgPace(r.reps);
    document.body.setAttribute("data-phase", "done");
    document.body.classList.remove("is-paused");
    let h = '<section class="view done" aria-labelledby="doneTitle"><h1 class="done-title" id="doneTitle">' + (r.complete ? "Done." : "Saved.") + "</h1>";
    h += '<p class="done-meta">Week ' + r.w + " · " + esc(r.title) + " · " + fmtClock(r.dur * 1000) + " · " + esc(fmtDist(r.dist)) + "</p>";
    if (ap) h += "<p>Average interval pace <strong>" + fmtPace(ap) + "/km</strong>, target " + fmtPace(z.target) + "/km.</p>";
    h += '<ul class="reps">';
    r.reps.forEach((x) => {
      h += '<li><div class="rep-main"><span>Interval ' + x.n + (x.skipped ? " (skipped)" : x.onTime ? " (ended on time)" : "") + "</span><span>" +
        esc(fmtDist(x.dist)) + " · " + fmtClock(x.time * 1000) + " · " + fmtPace(x.pace) + "/km</span></div>" +
        (x.splits.length ? '<p class="rep-splits">250 m splits: ' + x.splits.map(fmtPace).join(", ") + "</p>" : "") + "</li>";
    });
    if (!r.reps.length) h += '<li><p class="soft">No intervals were logged.</p></li>';
    h += "</ul>";
    h += '<div class="done-actions"><button type="button" class="btn" data-act="copy">Copy summary</button>';
    if (ui.copyText) h += '<textarea class="copy-box" id="copyBox" readonly>' + esc(ui.copyText) + "</textarea>";
    h += '</div><div class="sticky-bar"><button type="button" class="btn primary big" data-act="home">Back to start</button></div></section>';
    app.innerHTML = h;
  }
  function summaryText(r) {
    const lines = ["Sub-41 intervals: week " + r.w + ", " + r.title + ", " + fmtDay(new Date(r.date)),
      "Total " + fmtClock(r.dur * 1000) + ", " + fmtDist(r.dist)];
    r.reps.forEach((x) => {
      lines.push("Interval " + x.n + ": " + fmtDist(x.dist) + " in " + fmtClock(x.time * 1000) + " (" + fmtPace(x.pace) + "/km)" +
        (x.splits.length ? ", splits " + x.splits.map(fmtPace).join(", ") : ""));
    });
    return lines.join("\n");
  }

  // ---------- Events ----------
  app.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    unlockAudio();
    switch (b.getAttribute("data-act")) {
      case "start": startRun(); break;
      case "gps": startGps(); break;
      case "test-voice": say("On pace. " + spokenPace(ZONES[planFor(ui.week || currentWeek()).zone].target) + ".", true); beep(880, 0.15, 0.25); break;
      case "tol": store.tol = +b.getAttribute("data-tol"); save(); renderStart(); break;
      case "pause": togglePause(); break;
      case "skip": skipPhase(); break;
      case "end": ui.confirmEnd = true; renderRun(); break;
      case "end-cancel": ui.confirmEnd = false; renderRun(); break;
      case "end-save": finishRun(now(), false); break;
      case "end-discard": discardRun(); break;
      case "lock": setLock(true); break;
      case "copy": {
        const text = summaryText(ui.lastRun);
        const done = () => { b.textContent = "Copied"; };
        const fallback = () => { ui.copyText = text; renderDone(); const box = $("copyBox"); if (box) { box.focus(); box.select(); } };
        try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
        break;
      }
      case "home": ui.view = "start"; ui.lastRun = null; R = null; render(); app.scrollTop = 0; break;
    }
  });
  app.addEventListener("change", (e) => {
    if (e.target.id === "weekSel") { const v = +e.target.value; ui.week = v === currentWeek() ? null : v; renderStart(); }
  });
  document.addEventListener("pointerdown", unlockAudio, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { hiddenAt = now(); return; }
    if (R && !R.done && ui.view === "run") {
      const gap = hiddenAt ? now() - hiddenAt : 0;
      requestWake();
      tick();
      if (R && !R.done && gap > 3000) {
        R.note = "The screen was off for " + fmtClock(gap) + ", so cues and GPS paused. Keep the screen on.";
        R.noteUntil = now() + 60000;
        paint(now());
      }
    }
    hiddenAt = 0;
  });

  render();
})();
</script>
</body>
</html>
